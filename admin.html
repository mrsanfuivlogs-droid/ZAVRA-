<style>

:root{--bg:#f3f6fb;--card:#fff;--ink:#0f1b33;--mute:#6b7894;--line:#e6ebf4;--soft:#f1f5fb;--nav:#0b1a38;--nav2:#102650;--blue:#2563eb;--green:#16a34a;--red:#e11d48;--orange:#f59e0b;--purple:#7c3aed;--shadow:0 6px 22px rgba(15,35,80,.08);--font:'Plus Jakarta Sans',system-ui,sans-serif;--disp:'Sora','Plus Jakarta Sans',system-ui,sans-serif}

function lineChart(vals,labels,color='#2563eb',vals2){
  const W=640,H=250,L=44,R=26,T=14,B=28,max=Math.max(...vals,...(vals2||[0]))*1.12,x=i=>L+i*(W-L-R)/(vals.length-1),y=v=>T+(1-v/max)*(H-T-B);
  const path=a=>a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');
  let g='';for(let k=0;k<=4;k++){const v=max*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${compact(v)}</text>`}
  const step=Math.ceil(labels.length/7);let xl='';labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1)xl+=`<text x="${x(i)}" y="${H-8}" text-anchor="${i===labels.length-1?'end':'middle'}">${l}</text>`});
  const id='g'+Math.random().toString(36).slice(2,7),last=vals.length-1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales line chart"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${g}${xl}<path d="${path(vals)}L${x(last)} ${H-B}L${L} ${H-B}Z" fill="url(#${id})"/>${vals2?`<path d="${path(vals2)}" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linejoin="round"/>`:''}<path d="${path(vals)}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(last)}" cy="${y(vals[last])}" r="5" fill="${color}" stroke="var(--card)" stroke-width="2.5"/></svg>`}
function donut(parts,total,label){
  const R=62,C=2*Math.PI*R;let off=0;const sum=parts.reduce((a,p)=>a+p.v,0);
  const arcs=parts.map(p=>{const l=p.v/sum*C,s=`<circle r="${R}" cx="90" cy="90" fill="none" stroke="${p.c}" stroke-width="22" stroke-dasharray="${l-2} ${C-l+2}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"/>`;off+=l;return s}).join('');
  return `<svg viewBox="0 0 180 180" class="chart" style="max-width:190px;margin:auto" role="img" aria-label="${label}"><circle r="${R}" cx="90" cy="90" fill="none" stroke="var(--soft)" stroke-width="22"/>${arcs}<text x="90" y="88" text-anchor="middle" style="font-size:22px;font-weight:800;fill:var(--ink);font-family:var(--disp)">${total}</text><text x="90" y="106" text-anchor="middle">${label}</text></svg>`}
function bars(vals,labels,c='#7c3aed'){
  const W=640,H=230,L=44,B=26,T=12,max=Math.max(...vals)*1.15,bw=(W-L-10)/vals.length;
  let g='';for(let k=0;k<=4;k++){const v=max*k/4,yy=T+(1-v/max)*(H-T-B);g+=`<line x1="${L}" x2="${W-6}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${compact(v)}</text>`}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue by month">${g}${vals.map((v,i)=>{const h=(v/max)*(H-T-B);return `<rect x="${L+i*bw+bw*.2}" y="${H-B-h}" width="${bw*.6}" height="${h}" rx="6" fill="${c}" opacity="${.55+.45*i/vals.length}"/><text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`}).join('')}</svg>`}

function discCalc(k){const m=+$('#fm').value,d=+$('#fd').value,pr=$('#fp');if(k==='p'){if(m>0&&+pr.value>0&&m>+pr.value)$('#fd').value=Math.round((1-pr.value/m)*100);return}if(m>0&&d>0&&d<100)pr.value=+(m*(100-d)/100).toFixed(2)}
