<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZAVRA – Shop Smart, Live Better</title>
<meta name="description" content="ZAVRA: men's, women's and kids fashion, toys, kitchen and home. Free Cash on Delivery on orders of ₹2,999+.">
<style>
:root{--bg:#fff;--tx:#1b1530;--ln:#eadcf5;--mu:#7a7396;--p:#6200EA;--gold:#B8914A;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#14101f;--tx:#f1edff;--ln:#322a52;--mu:#a69fc4}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden}
header{background:linear-gradient(100deg,#7502f0,#8109fe,#0e12a3);color:#fff;padding:6px 10px 12px;position:sticky;top:0;z-index:20}
.top{display:flex;align-items:center;gap:2px}
.ib{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;color:#fff;cursor:pointer;position:relative;font-size:20px}
.logo{flex:1;text-align:center;font-family:Georgia,serif;letter-spacing:.35em;font-weight:700;font-size:22px}
.badge{position:absolute;right:2px;top:2px;background:#e11d48;color:#fff;border-radius:50%;min-width:18px;height:18px;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;padding:0 2px}
.search{margin-top:6px;background:#fff;border-radius:30px;display:flex;align-items:center;padding:0 12px;gap:8px}
.search input{flex:1;min-width:0;height:44px;border:0;outline:0;font:inherit;font-size:15px;background:none;color:#1b1530}
main{padding:12px;max-width:520px;margin:auto;padding-bottom:90px}
@media(min-width:900px){main{max-width:1280px}nav{max-width:760px!important}}
h1,h2,h3,.nm{font-family:'Cormorant Garamond',Georgia,serif;letter-spacing:.2px}
h2{font-weight:600;margin:16px 0 8px;font-size:20px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cat{background:#f7f0ff;border:1px solid var(--ln);border-radius:14px;padding:12px 4px;text-align:center;font-size:11px;font-weight:600;cursor:pointer;color:var(--tx)}
.cat em{display:block;font-size:24px;font-style:normal;margin-bottom:4px}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.pgrid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.pgrid{grid-template-columns:repeat(4,1fr)}}
.pc{background:#fff;border:1px solid #efe6d6;border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 6px 22px -14px rgba(20,16,31,.28)}
.pc .im{aspect-ratio:3/4;background:#f7f0ff;overflow:hidden}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .pn{padding:8px;font-size:13px;font-weight:600;line-height:1.3;height:44px;overflow:hidden}
.pc .pp{padding:0 8px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pc .pp b{font-size:15px;color:var(--tx)}
.pc .pp s{color:var(--mu);font-size:12px}
.off{background:linear-gradient(90deg,var(--gold),#d4b06a);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px}
.btn{background:var(--p);color:#fff;border:0;border-radius:12px;padding:0 20px;min-height:46px;font-weight:700;cursor:pointer;font:inherit;font-size:15px}
.btn.gold{background:linear-gradient(90deg,var(--gold),#d4b06a)}
.btn.full{width:100%;margin:8px 0}
.btn.ghost{background:none;color:var(--p);border:1.5px solid var(--p)}
.vh{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.vh h1{margin:0;font-size:20px}
.bk{width:40px;height:40px;border-radius:10px;border:1px solid var(--ln);background:none;color:var(--tx);font-size:20px;cursor:pointer}
.bn{background:linear-gradient(120deg,#6200EA,#FF1685);color:#fff;border-radius:16px;padding:24px 18px;margin-bottom:14px}
.bn h2{margin:0 0 6px;color:#fff;font-size:26px}
.bn p{margin:0;font-size:14px;opacity:.9}
input,textarea,select{font:inherit;width:100%;border:1px solid var(--ln);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--tx);min-height:44px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ci{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}
.q{display:flex;align-items:center;gap:6px}
.q button{width:36px;height:36px;border-radius:8px;border:1px solid var(--ln);background:none;font-size:18px;cursor:pointer;color:var(--tx)}
.em{text-align:center;color:var(--mu);padding:30px 10px}
.tabs{display:flex;border-bottom:1px solid var(--ln);margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;min-height:44px;font-weight:600;color:var(--mu);background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;padding:0 12px;white-space:nowrap}
.tabs button.on{color:var(--p);border-color:var(--p)}
.info p{line-height:1.65}
.info h3{margin:18px 0 6px;font-size:17px}
.info ul{padding-left:20px;line-height:1.7}
.chip{display:inline-block;background:#f7f0ff;border:1px solid var(--ln);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;margin:2px}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.pgrid-p{padding:8px 0;border-bottom:1px solid var(--ln)}
.adm label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
.ar{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.ar img{width:52px;height:64px;object-fit:cover;border-radius:8px;background:var(--ln)}
.ar>div{flex:1;min-width:0}
.ar button{min-height:36px;padding:0 10px;border:1px solid var(--ln);border-radius:8px;background:none;color:var(--tx);font:inherit;font-size:13px;cursor:pointer;margin-left:4px}
.pri{background:var(--p);color:#fff;border-radius:10px;min-height:44px;padding:0 18px;font-weight:700;border:0;margin:8px 8px 8px 0;cursor:pointer;font:inherit}
.gal{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px;margin-bottom:14px}
@media(min-width:900px){.gal{grid-template-columns:minmax(0,600px) 1fr;gap:30px}}
.gm{background:#f7f0ff;border-radius:14px;overflow:hidden;position:relative}
.gm img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover}
.pr2{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:8px 0}
.pr2 b{font-size:22px}
.pr2 s{color:var(--mu);font-size:14px}
.pin .nm{font-size:18px;font-weight:700;margin:0 0 4px;line-height:1.3}
footer{background:linear-gradient(165deg,#050505,#17120a 55%,#070707);color:#e9dcc0;padding:24px 18px 30px;margin-top:20px;border-top:2px solid var(--gold)}
footer h3{color:var(--gold);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin:18px 0 6px}
footer a{color:#e9dcc0;display:block;padding:6px 0;text-decoration:none;font-size:14px}
footer .zw{font-family:Georgia,serif;color:var(--gold);font-size:24px;letter-spacing:.35em}
.cp{font-size:12px;opacity:.75;text-align:center;margin-top:16px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--bg);border-top:1px solid var(--ln);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-height:60px;font-size:11px;font-weight:600;color:var(--tx);background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative;font:inherit}
nav .on{color:var(--p)}
nav .on::after{content:"";position:absolute;bottom:0;left:20%;right:20%;height:3px;border-radius:3px;background:var(--p)}
#zAdminBtn{position:fixed;bottom:80px;right:14px;z-index:99;background:var(--p);color:#fff;border-radius:50%;width:54px;height:54px;font-size:22px;box-shadow:0 4px 14px #0004;border:0;cursor:pointer}
#zAdminWrap{display:none;position:fixed;inset:0;background:#fbfaf8;z-index:100;overflow:auto;padding:14px 14px 90px}
#ztoast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1b1530;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:200;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center}
#ztoast.on{opacity:1}
.hero{background:linear-gradient(120deg,#f7d6ea,#f1e4fb 60%,#e9f7ef);border-radius:18px;padding:22px;margin-bottom:14px;color:#2a0b45}
.hero h2{font-size:28px;margin:0 0 6px}
.hero p{margin:0 0 10px;font-size:14px}
.wsi{background:#fdf6fc;border:1px solid var(--ln);border-radius:14px;padding:10px;text-align:center;cursor:pointer}
.wsi img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#f7f0ff}
.wsi b{display:block;margin-top:6px;font-size:13px}
</style>
</head>
<body>

<header>
  <div class="top">
    <button class="ib" onclick="toggleMenu()" aria-label="Menu">☰</button>
    <div class="logo">ZAVRA</div>
    <button class="ib" onclick="showView('wishlist')" aria-label="Wishlist">♡<span class="badge" id="wishBadge" style="display:none">0</span></button>
    <button class="ib" onclick="showView('cart')" aria-label="Cart">🛒<span class="badge" id="cartBadge" style="display:none">0</span></button>
  </div>
  <div class="search">
    <span>🔍</span>
    <input id="searchInput" placeholder="Search products..." onkeyup="if(event.key==='Enter')doSearch()">
  </div>
</header>

<main id="view"></main>

<nav>
  <button data-view="home" onclick="showView('home')">🏠<span>Home</span></button>
  <button data-view="category" onclick="showView('category')">📦<span>Shop</span></button>
  <button data-view="wholesale" onclick="showView('wholesale')">🏷️<span>Wholesale</span></button>
  <button data-view="cart" onclick="showView('cart')">🛒<span>Cart</span></button>
  <button data-view="profile" onclick="showView('profile')">👤<span>Profile</span></button>
</nav>

<button id="zAdminBtn" onclick="zOpenAdmin()" title="Admin">⚙️</button>

<!-- ================= ADMIN PANEL ================= -->
<div id="zAdminWrap">
  <div class="adm">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="margin:0">🛠️ Catalog Panel</h2>
      <button class="pri" style="margin:0" onclick="zCloseAdmin()">✕ Close</button>
    </div>
    <div id="zCount" style="font-size:13px;color:#7a7396;margin-bottom:12px"></div>

    <h3>➕ Category Add</h3>
    <div class="row2">
      <div><label>Category Name</label><input id="zCatName" placeholder="e.g. Saree"></div>
      <div><label>Emoji</label><input id="zCatEmoji" placeholder="👗" maxlength="2"></div>
    </div>
    <button class="pri" onclick="zAddCategory(document.getElementById('zCatName').value,document.getElementById('zCatEmoji').value);document.getElementById('zCatName').value='';document.getElementById('zCatEmoji').value='';">Add Category</button>
    <div id="zCatList"></div>

    <hr style="border:0;border-top:1px solid #eadcf5;margin:18px 0">

    <h3>➕ Product Add / Edit (Unlimited)</h3>
    <form id="zProductForm" onsubmit="event.preventDefault();zSubmitProduct();">
      <input type="hidden" id="zpId">
      <label>Product Name *</label><input id="zpName" required>
      <div class="row2">
        <div><label>Price ₹ *</label><input id="zpPrice" type="number" min="0" required></div>
        <div><label>Old Price ₹</label><input id="zpOld" type="number" min="0"></div>
      </div>
      <div class="row2">
        <div><label>Category</label><select id="zpCat"></select></div>
        <div><label>Stock</label><input id="zpStock" type="number" min="0"></div>
      </div>
      <label>Image URL</label><input id="zpImg" placeholder="https://...">
      <label>Description</label><textarea id="zpDesc" rows="3"></textarea>
      <button class="pri" type="submit">💾 Save Product</button>
      <button type="button" class="pri" style="background:#7a7396" onclick="document.getElementById('zProductForm').reset();document.getElementById('zpId').value=''">Reset</button>
    </form>

    <hr style="border:0;border-top:1px solid #eadcf5;margin:18px 0">
    <h3>📦 All Products</h3>
    <div id="zProdList"></div>
  </div>
</div>

<div id="ztoast"></div>

<script>
/* ================= DATA ================= */
const ZDB = {
  get products(){try{return JSON.parse(localStorage.getItem('zavra_products')||'[]')}catch(e){return[]}},
  set products(v){localStorage.setItem('zavra_products',JSON.stringify(v))},
  get categories(){try{return JSON.parse(localStorage.getItem('zavra_categories')||'[]')}catch(e){return[]}},
  set categories(v){localStorage.setItem('zavra_categories',JSON.stringify(v))},
  get cart(){try{return JSON.parse(localStorage.getItem('zavra_cart')||'[]')}catch(e){return[]}},
  set cart(v){localStorage.setItem('zavra_cart',JSON.stringify(v))},
  get wish(){try{return JSON.parse(localStorage.getItem('zavra_wish')||'[]')}catch(e){return[]}},
  set wish(v){localStorage.setItem('zavra_wish',JSON.stringify(v))}
};

const DEFAULT_CATS = [
  {id:'c1',name:'Women',emoji:'👗'},{id:'c2',name:'Men',emoji:'👔'},
  {id:'c3',name:'Kids',emoji:'🧸'},{id:'c4',name:'Toys',emoji:'🎮'},
  {id:'c5',name:'Kitchen',emoji:'🍳'},{id:'c6',name:'Home',emoji:'🏠'},
  {id:'c7',name:'Beauty',emoji:'💄'},{id:'c8',name:'Electronics',emoji:'📱'}
];

const DEFAULT_PRODUCTS = [
  {id:'p1',name:'Cotton Kurti',price:499,oldPrice:999,category:'Women',image:'https://picsum.photos/seed/kurti/400/500',desc:'Soft cotton kurti, daily wear.',stock:20},
  {id:'p2',name:'Men T-Shirt',price:399,oldPrice:699,category:'Men',image:'https://picsum.photos/seed/tshirt/400/500',desc:'Premium cotton tee.',stock:15},
  {id:'p3',name:'Kids Frocks',price:599,oldPrice:999,category:'Kids',image:'https://picsum.photos/seed/frock/400/500',desc:'Fancy frocks for girls.',stock:10},
  {id:'p4',name:'Steel Kadai',price:749,oldPrice:1299,category:'Kitchen',image:'https://picsum.photos/seed/kadai/400/500',desc:'Heavy base steel kadai.',stock:8},
  {id:'p5',name:'Wall Clock',price:299,oldPrice:599,category:'Home',image:'https://picsum.photos/seed/clock/400/500',desc:'Modern wall clock.',stock:25},
  {id:'p6',name:'Lipstick Set',price:449,oldPrice:899,category:'Beauty',image:'https://picsum.photos/seed/lip/400/500',desc:'Matte lipstick set of 3.',stock:30}
];

function zSeed(){
  if(!ZDB.categories.length) ZDB.categories = DEFAULT_CATS;
  if(!ZDB.products.length) ZDB.products = DEFAULT_PRODUCTS;
}

/* ================= TOAST ================= */
function zToast(msg){
  const t=document.getElementById('ztoast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800);
}

/* ================= ROUTER ================= */
let CURRENT='home';
function showView(name,data){
  CURRENT=name;
  window.scrollTo(0,0);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===name));
  const v=document.getElementById('view');
  const views={
    home:renderHome,
    login:renderLogin,
    register:renderRegister,
    search:renderSearch,
    category:renderCategory,
    product:renderProduct,
    cart:renderCart,
    wishlist:renderWishlist,
    checkout:renderCheckout,
    success:renderSuccess,
    track:renderTrack,
    profile:renderProfile,
    about:()=>renderInfo('About Us','ZAVRA is India\'s trusted online store for fashion, home, kitchen and more. Shop Smart, Live Better.'),
    contact:renderContact,
    privacy:()=>renderInfo('Privacy Policy','We respect your privacy. Your data is never sold or shared with third parties. All transactions are encrypted.'),
    terms:()=>renderInfo('Terms & Conditions','By shopping on ZAVRA you agree to our terms. Prices are subject to change. Products are subject to availability.'),
    returns:()=>renderInfo('Return Policy','Easy 7-day returns on most products. Product must be unused with original packaging. Refund within 5-7 business days.'),
    shipping:()=>renderInfo('Shipping Policy','Free Cash on Delivery on orders of ₹2,999 and above. Standard delivery 3-7 business days across India.'),
    faq:renderFAQ,
    wholesale:renderWholesale,
    wscategory:renderWSCategory,
    wsproduct:renderWSProduct
  };
  v.innerHTML=(views[name]||renderHome)(data);
  updateBadges();
}

/* ================= HOME ================= */
function renderHome(){
  const cats=ZDB.categories;
  const prods=ZDB.products.slice(0,12);
  return `
    <div class="bn"><h2>🎉 Big Sale — Up to 70% Off</h2><p>Free Cash on Delivery on ₹2,999+</p></div>
    <h2>Shop by Category</h2>
    <div class="cats">
      ${cats.map(c=>`<div class="cat" onclick="showView('category','${c.name}')"><em>${c.emoji||'📦'}</em>${c.name}</div>`).join('')}
    </div>
    <h2>Trending Products</h2>
    <div class="pgrid">${prods.map(productCard).join('')||'<p class="em">No products yet.</p>'}</div>
  `;
}

function productCard(p){
  const off=p.oldPrice>p.price?Math.round((1-p.price/p.oldPrice)*100):0;
  return `<div class="pc" onclick="showView('product','${p.id}')">
    <div class="im"><img src="${p.image||'https://picsum.photos/seed/'+p.id+'/400/500'}" loading="lazy" alt="${p.name}"></div>
    <div class="pn">${p.name}</div>
    <div class="pp"><b>₹${p.price}</b>${p.oldPrice?`<s>₹${p.oldPrice}</s>`:''}${off?`<span class="off">${off}%</span>`:''}</div>
  </div>`;
}

/* ================= LOGIN ================= */
function renderLogin(){
  return `
    <div class="vh"><button class="bk" onclick="showView('home')">←</button><h1>Login</h1></div>
    <form onsubmit="event.preventDefault();zToast('Login success (demo)');showView('home')">
      <label>Email</label><input type="email" required placeholder="you@example.com">
      <label>Password</label><input type="password" required placeholder="••••••••">
      <button class="btn full" type="submit">Login</button>
      <button class="btn full ghost" type="button" onclick="showView('register')">Create Account</button>
    </form>
  `;
}

/* ================= REGISTER ================= */
function renderRegister(){
  return `
    <div class="vh"><button class="bk" onclick="showView('login')">←</button><h1>Register</h1></div>
    <form onsubmit="event.preventDefault();zToast('Account created (demo)');showView('home')">
      <label>Full Name</label><input required>
      <label>Email</label><input type="email" required>
      <label>Password</label><input type="password" required minlength="6">
      <button class="btn full" type="submit">Register</button>
      <button class="btn full ghost" type="button" onclick="showView('login')">Already have an account?</button>
    </form>
  `;
}

/* ================= SEARCH ================= */
function doSearch(){
  const q=document.getElementById('searchInput').value.trim();
  showView('search',q);
}
function renderSearch(q){
  q=(q||'').toLowerCase();
  const list=q?ZDB.products.filter(p=>p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)):[];
  return `
    <h2>Search: "${q||'—'}"</h2>
    <div class="pgrid">${list.map(productCard).join('')||'<p class="em">No products found.</p>'}</div>
  `;
}

/* ================= CATEGORY ================= */
function renderCategory(cat){
  const cats=ZDB.categories;
  const active=cat||'all';
  const list=active==='all'?ZDB.products:ZDB.products.filter(p=>p.category===active);
  return `
    <h2>Browse Products</h2>
    <div style="margin-bottom:10px">
      <span class="chip ${active==='all'?'on':''}" onclick="showView('category','all')">All</span>
      ${cats.map(c=>`<span class="chip ${active===c.name?'on':''}" onclick="showView('category','${c.name}')">${c.emoji||''} ${c.name}</span>`).join('')}
    </div>
    <div class="pgrid">${list.map(productCard).join('')||'<p class="em">No products in this category.</p>'}</div>
  `;
}

/* ================= PRODUCT ================= */
function renderProduct(id){
  const p=ZDB.products.find(x=>x.id===id);
  if(!p) return '<p class="em">Product not found.</p>';
  const off=p.oldPrice>p.price?Math.round((1-p.price/p.oldPrice)*100):0;
  return `
    <div class="vh"><button class="bk" onclick="history.back()">←</button><h1>Product</h1></div>
    <div class="gal">
      <div class="gm"><img src="${p.image||'ht
