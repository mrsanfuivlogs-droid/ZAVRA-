<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MyComa Admin Panel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap">
<style>
/* Layout: fixed navy sidebar + sticky top bar + scrolling workspace of cards. Semantic colours (green/red/blue/orange/purple) carry meaning on every status pill. */
:root{--bg:#f3f6fb;--card:#fff;--ink:#0f1b33;--mute:#6b7894;--line:#e6ebf4;--soft:#f1f5fb;--nav:#0b1a38;--nav2:#102650;--blue:#2563eb;--green:#16a34a;--red:#e11d48;--orange:#f59e0b;--purple:#7c3aed;--shadow:0 6px 22px rgba(15,35,80,.08);--font:'Plus Jakarta Sans',system-ui,sans-serif;--disp:'Sora','Plus Jakarta Sans',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1122;--card:#121c33;--ink:#e8eefb;--mute:#93a1c0;--line:#1f2c49;--soft:#18243f;--shadow:0 6px 22px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1122;--card:#121c33;--ink:#e8eefb;--mute:#93a1c0;--line:#1f2c49;--soft:#18243f;--shadow:0 6px 22px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,var(--nav),var(--nav2));color:#c9d6f2;position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px 24px;scrollbar-width:thin}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand b{font-family:var(--disp);font-size:20px;color:#fff;letter-spacing:.2px;display:block;line-height:1.1}
.brand small{color:#8fa4d4;font-size:11px;letter-spacing:.4px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav h6{margin:14px 10px 4px;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:#6f86b8;font-weight:700}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;color:inherit;text-align:left;padding:8px 10px;border-radius:11px;font-weight:500;transition:.18s}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:linear-gradient(90deg,var(--blue),color-mix(in srgb,var(--blue) 65%,#fff));color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--blue) 40%,transparent)}
.nav .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.nav .ic svg{width:17px;height:17px}
.nav .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:20px;font-size:11px;padding:1px 8px;font-weight:700}
.pro{margin:22px 4px 0;padding:16px;border-radius:16px;background:linear-gradient(135deg,#1e3a8a,#4c1d95);text-align:center;color:#fff}
.pro b{display:block;font-family:var(--disp);margin-bottom:4px}
.pro p{margin:0 0 12px;font-size:12px;color:#c8d3f5}
.pro button{background:#fbbf24;color:#3b2a00;border:0;border-radius:10px;padding:8px 14px;font-weight:700}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px 20px;box-shadow:0 2px 12px rgba(15,35,80,.05)}
.burger{display:none;border:0;background:var(--soft);border-radius:10px;width:40px;height:40px;place-items:center}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 14px 10px 38px;outline:none}
.search input:focus,.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.18)}
.search svg{position:absolute;left:12px;top:11px;width:17px;height:17px;color:var(--mute)}
.tr{margin-left:auto;display:flex;align-items:center;gap:10px}
.sel{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 10px;font-weight:600}
.ibtn{position:relative;width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--soft);display:grid;place-items:center}
.ibtn svg{width:19px;height:19px}
.ibtn i{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;border-radius:20px;font-style:normal;font-size:10px;font-weight:700;padding:1px 6px}
.me{display:flex;align-items:center;gap:9px;padding-left:6px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:linear-gradient(135deg,#7c3aed,#2563eb);flex:none}
.me div{line-height:1.2}.me small{color:var(--mute);font-size:11.5px}
.page{padding:22px max(16px,env(safe-area-inset-right,0px)) 40px 20px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ph{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.ph h1{font-family:var(--disp);font-size:26px;margin:0;letter-spacing:-.3px}
.ph p{margin:2px 0 0;color:var(--mute)}
.btn{border:0;border-radius:11px;padding:9px 16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--blue),color-mix(in srgb,var(--blue) 65%,#fff));box-shadow:0 6px 16px color-mix(in srgb,var(--blue) 30%,transparent);transition:.18s}
.btn:hover{transform:translateY(-2px)}
.btn.g{background:linear-gradient(135deg,#16a34a,#22c55e);box-shadow:0 6px 16px rgba(22,163,74,.28)}
.btn.r{background:linear-gradient(135deg,#e11d48,#f43f5e);box-shadow:0 6px 16px rgba(225,29,72,.25)}
.btn.o{background:linear-gradient(135deg,#f59e0b,#fb923c);box-shadow:0 6px 16px rgba(245,158,11,.3)}
.btn.p{background:linear-gradient(135deg,#7c3aed,#a855f7);box-shadow:0 6px 16px rgba(124,58,237,.28)}
.btn.s{background:var(--soft);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:9px}
.grid{display:grid;gap:16px}
.g6{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.d6{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:1000px){.d6{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.d6{grid-template-columns:minmax(0,1fr)}}
.stat{border-radius:16px;padding:16px 18px;color:#fff;display:flex;gap:14px;align-items:center;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:.2s}
.stat:hover{transform:translateY(-4px)}
.stat .ico{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.stat .ico svg{width:26px;height:26px}
.stat small{opacity:.9;font-weight:500}
.stat b{display:block;font-family:var(--disp);font-size:24px;line-height:1.15}
.stat em{font-style:normal;font-size:12px;font-weight:700;opacity:.95}
.stat:after{content:"";position:absolute;right:-26px;bottom:-34px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.1)}
.c-blue{background:linear-gradient(135deg,#1d4ed8,#3b82f6)}.c-green{background:linear-gradient(135deg,#15803d,#22c55e)}.c-red{background:linear-gradient(135deg,#be123c,#f43f5e)}.c-orange{background:linear-gradient(135deg,#d97706,#fbbf24)}.c-purple{background:linear-gradient(135deg,#6d28d9,#a78bfa)}.c-teal{background:linear-gradient(135deg,#0f766e,#2dd4bf)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.card>h3,.ch{font-weight:700;margin:0;padding:16px 18px 0;font-size:15.5px;font-family:var(--disp);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cb{padding:14px 18px 18px}
.cols{display:grid;gap:16px;margin-top:16px}
.c-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.c-1-1{grid-template-columns:repeat(2,minmax(0,1fr))}.c-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:10px}
.seg button{border:0;background:none;padding:4px 11px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--blue);box-shadow:0 2px 8px rgba(15,35,80,.12)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td:nth-last-child(2){white-space:nowrap}td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .15s}tbody tr:hover{background:var(--soft)}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.p-green{background:rgba(22,163,74,.14);color:var(--green)}.p-orange{background:rgba(245,158,11,.17);color:#b45309}.p-blue{background:rgba(37,99,235,.14);color:var(--blue)}.p-red{background:rgba(225,29,72,.13);color:var(--red)}.p-purple{background:rgba(124,58,237,.14);color:var(--purple)}.p-gray{background:var(--soft);color:var(--mute)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .p-orange{color:#fbbf24}}
:root[data-theme="dark"] .p-orange{color:#fbbf24}
.th{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-family:var(--disp);flex:none;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.pn{display:flex;align-items:center;gap:11px;min-width:190px}.pn small{color:var(--mute);display:block}
.bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;min-width:70px}.bar i{display:block;height:100%;border-radius:8px}
.tb{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.tb .search{flex:1 1 220px;max-width:340px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;font-weight:600;white-space:nowrap;color:var(--mute)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tabs button b{margin-left:5px;opacity:.75}
.f{display:grid;gap:12px}
.f label{display:grid;gap:5px;font-weight:600;font-size:12.5px;color:var(--mute)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:9px 12px;outline:none;font-weight:500;color:var(--ink);width:100%}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{appearance:none;width:42px;height:24px;border-radius:24px;background:#c3cbdc;position:relative;cursor:pointer;transition:.2s;margin:0}
.sw input:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sw input:checked{background:var(--green)}.sw input:checked:after{left:21px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border:0}
.row small{color:var(--mute);display:block}
.row>div:first-child{min-width:0;flex:1 1 180px}
.act{display:flex;gap:6px;align-items:center}
.warn{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;background:rgba(225,29,72,.08);margin-bottom:8px}
.warn .th{width:40px;height:40px}.warn>div:not(.th){flex:1;min-width:0}.warn small{color:var(--red);font-weight:700}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.qa button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 8px;display:grid;gap:6px;justify-items:center;font-weight:600;font-size:12.5px;transition:.18s}
.qa button:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.qa .ic2{width:38px;height:38px;border-radius:11px;display:grid;place-items:center}
.qa svg{width:20px;height:20px}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl div{position:relative;padding:0 0 14px}
.tl div:before{content:"";position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--blue));box-shadow:0 0 0 3px var(--card)}
.tl small{color:var(--mute);display:block}
.legend{display:grid;gap:9px}.legend div{display:flex;align-items:center;gap:8px}.legend i{width:11px;height:11px;border-radius:4px;flex:none}.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font-size:11px;font-family:var(--font)}
.modal{position:fixed;inset:0;background:rgba(7,15,35,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal.on{display:flex}
.mb{background:var(--card);border-radius:18px;max-width:620px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:in .25s}
.mb h2{margin:0 0 14px;font-family:var(--disp);font-size:19px;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--soft);width:32px;height:32px;border-radius:9px;font-size:18px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#0f1b33;color:#fff;padding:11px 20px;border-radius:12px;font-weight:600;opacity:0;transition:.3s;z-index:90;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ov{display:none;position:fixed;inset:0;background:rgba(7,15,35,.5);z-index:40}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}.kv span:nth-child(odd){color:var(--mute)}
.chat{height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.bub{max-width:80%;padding:8px 13px;border-radius:14px;background:var(--soft)}.bub.me2{align-self:flex-end;background:var(--blue);color:#fff}
.banner{border-radius:14px;padding:18px;color:#fff;min-height:110px;display:flex;flex-direction:column;justify-content:flex-end}
.banner b{font-family:var(--disp);font-size:17px}.banner small{opacity:.9}
.cd{display:flex;gap:8px}.cd div{background:rgba(255,255,255,.2);border-radius:10px;padding:6px 10px;text-align:center;min-width:54px}.cd b{display:block;font-size:20px}
.stars{color:var(--orange);letter-spacing:2px}
.qr{width:120px;height:120px;border-radius:10px;background:repeating-conic-gradient(var(--ink) 0 25%,var(--card) 0 50%) 0 0/16px 16px;border:6px solid var(--card);outline:1px solid var(--line)}
@media(max-width:1100px){.c-2-1,.c-3{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){
.app{grid-template-columns:minmax(0,1fr)}
.side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:50;transform:translateX(-100%);transition:.28s}
.side.on{transform:none}.ov.on{display:block}
.burger{display:grid}.me div{display:none}.sel{padding:8px 6px}
.search{display:none}
.top{padding-left:max(16px,env(safe-area-inset-left,0px))}
.page{padding-left:max(16px,env(safe-area-inset-left,0px))}
.c-1-1,.f2{grid-template-columns:minmax(0,1fr)}
}
#bnav{display:none}
@media(max-width:900px){#bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding:6px max(8px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));box-shadow:0 -6px 20px rgba(15,35,80,.08)}
#bnav button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);padding:4px 0}
#bnav button.on{color:var(--blue)}#bnav svg{width:21px;height:21px}.page{padding-bottom:90px}}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--soft);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--mute)}
.cn{display:flex;gap:12px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;flex:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="app">
<aside class="side" id="side"></aside>
<div class="ov" id="ov"></div>
<div class="main">
<header class="top">
<button class="burger" id="burger" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="gs" placeholder="Search products, orders, customers…" autocomplete="off"></div>

<select class="sel" id="cur" aria-label="Currency"><option value="INR">₹ INR</option><option value="USD">$ USD</option><option value="EUR">€ EUR</option></select>
<button class="ibtn" id="th" aria-label="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>

</div></div>

function discCalc(k){const m=+$('#fm').value,d=+$('#fd').value,pr=$('#fp');if(k==='p'){if(m>0&&+pr.value>0&&m>+pr.value)$('#fd').value=Math.round((1-pr.value/m)*100);return}if(m>0&&d>0&&d<100)pr.value=+(m*(100-d)/100).toFixed(2)}

  L.slice(1).forEach(l=>{const c=csvLine(l),g=k=>c[h.indexOf(k)]||'';const pr=+g('price');if(!g('name')||!(pr>0)){bad++;return}ok++;P.unshift({id:Date.now()+ok,n:g('name'),sku:g('sku')||'MC-IMP-'+ok,cat:g('category')||CATS[0].n,price:pr,mrp:+g('mrp')||0,stock:+g('stock')||0,v:g('variants')||'Standard',st:'Draft',sold:0})});

const NAV=[['Overview',[['dashboard','Dashboard','home','blue']]],['Sales',[['orders','Orders','cart','blue',12],['returns','Returns / RTO','trend','red',3],['customers','Customers','users','red'],['messages','Customer Messages','bell','green'],['payments','Payments','card','green'],['accounts','GST & Settlements','cash','purple'],['coupons','Coupons & Offers','tag','orange']]],['Catalogue',[['products','Products','box','orange'],['catalogs','Catalogs & Upload','file','blue'],['categories','Categories','grid','purple'],['inventory','Inventory','layers','green'],['sellers','Sellers','shield','red']]],['Delivery',[['partners','Delivery Partners','truck','blue'],['shipping','Shipping & Tracking','truck','purple']]],['Growth',[['ads','Marketing & Ads','mega','red'],['marketing','Banners & Sales','star','orange'],['reports','Reports & Analytics','chart','blue'],['reviews','Reviews & Ratings','star','orange'],['notifications','Notifications','bell','purple']]],['Store',[['appearance','Website Appearance','pal','green'],['pages','Pages & Content','file','blue'],['integrations','Integrations','cog','purple']]],['System',[['users','Admin Users','shield','purple'],['settings','Settings','cog','orange'],['support','Customer Support','help','green'],['security','Security','lock','red']]]];

let view='dashboard';
function side(){$('#side').innerHTML=`<div class="brand"><svg width="38" height="38" viewBox="0 0 40 40"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#lg)"/><path d="M12 15h16l-1.5 15h-13zM16 15v-2a4 4 0 0 1 8 0v2" fill="none" stroke="#0b1a38" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b>MyComa</b><small>Admin Panel</small></div></div><nav class="nav">${NAV.map(g=>`<h6>${g[0]}</h6>`+g[1].map(n=>`<button class="${n[0]===view?'on':''}" onclick="go('${n[0]}')"><span class="ic" style="background:${n[0]===view?'rgba(255,255,255,.2)':'color-mix(in srgb,var(--'+n[3]+') 24%,transparent)'};color:${n[0]===view?'#fff':'var(--'+n[3]+')'}">${ico(n[2])}</span>${n[1]}${n[4]?`<span class="cnt">${n[4]}</span>`:''}</button>`).join('')).join('')}</nav><div class="pro"><b>Go Pro</b><p>Unlock automation, multi-store and priority support.</p><button onclick="toast('Upgrade plans coming soon')">Upgrade now</button></div>`}
function bnav(){$('#bnav').innerHTML=[['dashboard','Home','home'],['orders','Orders','cart'],['returns','Returns','trend'],['inventory','Inventory','layers']].map(b=>`<button class="${view===b[0]?'on':''}" onclick="go('${b[0]}')">${ico(b[2])}${b[1]}</button>`).join('')+`<button onclick="openNav()">${ico('grid')}Menu</button>`}
function render(){side();bnav();$('#page').innerHTML=V[view]();$('#page').style.animation='none';void $('#page').offsetWidth;$('#page').style.animation=''}
function go(v){view=v;if(location.hash!=='#'+v)history.replaceState(null,'','#'+v);closeNav();render();window.scrollTo(0,0)}
function openNav(){$('#side').classList.add('on');$('#ov').classList.add('on')}
function closeNav(){$('#side').classList.remove('on');$('#ov').classList.remove('on')}
$('#burger').onclick=openNav;$('#ov').onclick=closeNav;$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};
$('#cur').onchange=e=>{cur=e.target.value;render();toast('Showing amounts in '+cur)};
$('#bell').onclick=()=>toast('5 new notifications: orders, refunds and low stock');
$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
$('#gs').onkeydown=e=>{if(e.key==='Enter'){const q=e.target.value.trim().toLowerCase();if(!q)return;if(O.some(o=>o.id.toLowerCase().includes(q))){ot='All';go('orders')}else if(CU.some(c=>c.n.toLowerCase().includes(q)))go('customers');else{pq=e.target.value;go('products')}}};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
const h=location.hash.slice(1);if(V[h])view=h;
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(V[h]&&h!==view){view=h;render()}});
render();
</script>
