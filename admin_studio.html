<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAVRA Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','system-ui','sans-serif']},colors:{brand:{50:'#f5f0ff',100:'#ede4ff',500:'#7c3aed',600:'#6200EA',700:'#4c1bb8',900:'#1b0a45'}}}}}
</script>
<style>
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#f4f2fb;color:#1d1436}
  .side{background:linear-gradient(180deg,#1b0a45 0%,#2b1170 100%)}
  .navi{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;color:#e9e4ff;font-weight:600;font-size:14px;cursor:pointer;width:100%;text-align:left;background:transparent;border:0}
  .navi:hover{background:rgba(255,255,255,.07)}
  .navi.on{background:linear-gradient(90deg,#7c3aed,#6200EA);color:#fff;box-shadow:0 6px 16px rgba(98,0,234,.35)}
  .sub{margin:2px 0 6px 34px;display:flex;flex-direction:column;gap:2px}
  .sub button{text-align:left;color:#cfc6f5;font-size:13px;padding:6px 10px;border-radius:8px;background:transparent;border:0;cursor:pointer}
  .sub button.on{color:#fff;background:rgba(255,255,255,.12)}
  .card{background:#fff;border:1px solid #ece7f7;border-radius:18px;box-shadow:0 1px 2px rgba(20,10,60,.04)}
  .tile{border-radius:18px;padding:18px 20px;display:flex;align-items:center;gap:14px}
  .ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.7)}
  .btn{background:#6200EA;color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer}
  .btn:hover{background:#4c1bb8}
  .btn2{background:#fff;color:#6200EA;border:1px solid #ddd3f3;border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer}
  .btn3{background:#16a34a;color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer}
  .btnx{background:#e11d48;color:#fff;border:0;border-radius:10px;padding:7px 11px;font-weight:700;font-size:12px;cursor:pointer}
  .inp{border:1px solid #ddd3f3;border-radius:12px;padding:10px 12px;font-size:14px;background:#fff;width:100%;outline:none}
  .inp:focus{border-color:#6200EA;box-shadow:0 0 0 3px rgba(98,0,234,.12)}
  .lbl{font-size:13px;font-weight:600;color:#1d1436;display:block;margin-bottom:6px}
  table.t{width:100%;border-collapse:collapse;font-size:14px}
  table.t th{background:#f6f2fd;text-align:left;padding:12px;font-weight:700;color:#1d1436}
  table.t td{padding:12px;border-top:1px solid #f1edf9;vertical-align:middle}
  .pill{display:inline-block;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700}
  .empty{padding:36px;text-align:center;color:#6f6a86}
  .switch{position:relative;display:inline-block;width:44px;height:24px}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#cbd5e1;border-radius:999px;transition:.2s;cursor:pointer}
  .slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked + .slider{background:#16a34a}
  .switch input:checked + .slider:before{transform:translateX(20px)}
  .modal{position:fixed;inset:0;background:rgba(20,10,60,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal.open{display:flex}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d1436;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;display:none;z-index:60;max-width:90vw}
  .scroll-x{overflow-x:auto}
  @media(max-width:900px){.hide-m{display:none!important}}

  /* ---- LOGIN (matches reference image) ---- */
  .lhero{display:block;width:100%;height:auto}
  .mtitle{padding:24px 20px 0}
  .lform{margin:12px 16px;background:#fff;border-radius:24px;padding:22px 20px;box-shadow:0 20px 50px -20px rgba(98,0,234,.35)}
  .fld{display:block;width:100%;border:1px solid #ddd3f3;border-radius:14px;padding:12px 16px;margin:0 0 14px;background:#fff;position:relative;font-size:15px;text-align:left}
  .fld input[type=email],.fld input[type=password],.fld input[type=tel],.fld input[type=text]{width:100%;border:0;outline:none;background:transparent;font-size:15px;padding:0}
  .fld input[type=checkbox]{width:16px;height:16px;accent-color:#6200EA;margin-right:8px}
  .l-remember{display:flex;align-items:center;font-weight:600;border:0;padding:0;background:transparent}
  .l-forgot{text-align:right;color:#6200EA;font-weight:700;border:0;background:transparent;padding:0}
  .btnl{background:linear-gradient(90deg,#7c3aed,#6200EA);color:#fff;font-weight:800;text-align:center;padding:14px;border:0}
  .btng{text-align:center;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px}
  .lnk{color:#6200EA;font-weight:700;border:0;background:transparent;cursor:pointer}
  .l-contact{text-align:center;border:0;margin:0;color:#1d1436}
  .l-phone{display:block;margin:14px auto 0;width:auto;border:0;background:transparent;text-align:center;font-weight:700}
  .eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:#6200EA;padding:4px}
  @media (min-width:1024px){
    .lwrap{position:relative;width:100%;aspect-ratio:1672/941;background:#f4f2fb url(assets/brand/login-reference.png) center/100% 100% no-repeat;min-height:600px}
    .lhero,.mtitle{display:none}
    .lform{position:static;margin:0;padding:0;background:none;box-shadow:none;border-radius:0}
    .fld{position:absolute;border:0;background:transparent;padding:0;margin:0;border-radius:0;width:auto}
    .fld input::placeholder{color:transparent}
    .lwrap .l-email input[type=email],.lwrap .l-pass input[type=password]{height:100%;box-sizing:border-box;padding:0 0 0 15%;color:#1d1436;font-size:15px}
    .lwrap .l-pass input[type=password]{padding-right:12%}
    .l-email,.l-pass{display:flex;align-items:center}
    .lwrap .l-email input,.lwrap .l-pass input{width:100%;font-family:inherit}
    .l-remember input,.l-remember span{color:transparent}
    .lnk,.btnl,.btng,.l-contact,.l-phone{color:transparent}
    .btng svg{opacity:0}
    .eye{color:transparent}
    .eye svg{opacity:0}
    .l-email{left:61.8%;top:43.5%;width:34.1%;height:7%}
    .l-pass{left:61.8%;top:52.4%;width:34.1%;height:6.9%}
    .l-remember{left:61.8%;top:60%;width:12%;height:3.2%}
    .l-forgot{left:71%;top:60%;width:19%;height:3.2%}
    .l-login{left:61.8%;top:67.4%;width:34.1%;height:6.3%}
    .l-google{left:61.8%;top:79.5%;width:34.1%;height:6.4%}
    .l-contact{left:58%;top:88.2%;width:26%;height:3.2%}
    .l-phone{left:30%;top:95.6%;width:26%;height:3%;color:#fff;background:transparent}
    .l-phone{color:transparent}
    .eye{left:auto;right:0;width:6%;height:100%;top:0;transform:none}
    .l-pass .eye{right:0}
    .l-remember input{position:absolute;left:0;top:50%;transform:translateY(-50%);width:100%;height:100%;opacity:0;margin:0}
    .l-remember{cursor:pointer}
  }
</style>
</head>
<body class="min-h-screen">

<!-- ================= LOGIN ================= -->
<div id="login" class="min-h-screen bg-[#f4f2fb]" style="display:none">
  <div class="lwrap">
    <img class="lhero" src="assets/brand/login-reference.png" alt="ZAVRA Admin">
    <div class="mtitle">
      <div class="text-center mt-2"><div class="text-3xl font-extrabold tracking-[0.2em] text-brand-600">ZAVRA</div><div class="text-sm font-bold tracking-wide text-violet-950">Admin Panel</div><h2 class="text-2xl font-extrabold mt-4">Login to Your Account</h2><p class="text-sm text-violet-900/60">Enter your credentials to continue</p></div>
    </div>
    <form id="emailForm" class="lform" onsubmit="emailLogin(event)">
      <div class="fld l-email"><input id="adminEmail" type="email" autocomplete="username" placeholder="Email Address" required></div>
      <div class="fld l-pass"><input id="adminPassword" type="password" autocomplete="current-password" placeholder="Password" required><button type="button" class="eye" onclick="pwToggle()" aria-label="Show or hide password"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <label class="fld l-remember"><input id="remember" type="checkbox" checked><span>Remember Me</span></label>
      <button type="button" class="fld lnk l-forgot" onclick="resetPassword()">Forgot Password?</button>
      <button class="fld btnl l-login" type="submit">Login</button>
      <button type="button" class="fld btng l-google" onclick="googleLogin()"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 019.5 24c0-1.6.3-3.2.8-4.7l-7.8-6.1A24 24 0 000 24c0 3.9.9 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.7-4.2-13.6-10l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Login with Google</button>
      <button type="button" class="fld lnk l-contact" onclick="toast('Ask the store owner to add your email to the admin list')">Contact Support</button>
    </form>
    <button type="button" class="fld lnk l-phone" onclick="showPhone(true)">Login with phone OTP</button>
  </div>
  <div id="loginMsg" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-white text-rose-700 border border-rose-200 shadow-lg rounded-xl px-4 py-2 text-sm font-semibold" style="display:none;max-width:90vw"></div>
  <div id="phonePanel" class="fixed inset-0 z-50 bg-violet-950/50 items-center justify-center p-4" style="display:none" onclick="if(event.target===this)showPhone(false)">
    <form id="phoneForm" class="bg-white rounded-3xl p-7 w-full max-w-md space-y-4" onsubmit="sendPhoneOtp(event)">
      <div class="flex items-center justify-between"><h3 class="font-extrabold text-lg">Login with phone OTP</h3><button type="button" class="text-2xl leading-none" onclick="showPhone(false)">×</button></div>
      <div><label class="lbl">Phone Number</label><input id="adminPhone" class="inp" type="tel" value="+917602074049" required></div>
      <div id="otpRow" class="hidden"><label class="lbl">OTP Code</label><input id="adminOtp" class="inp" inputmode="numeric" placeholder="6-digit code"></div>
      <button id="phoneBtn" class="btn w-full py-3" type="submit">Send OTP</button>
      <button id="verifyBtn" class="btn3 w-full py-3 hidden" type="button" onclick="verifyPhoneOtp()">Verify &amp; Login</button>
      <div id="recaptcha"></div>
    </form>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="min-h-screen lg:flex" style="display:none">
  <aside id="side" class="side text-white w-full hidden lg:flex lg:w-64 lg:min-h-screen lg:sticky lg:top-0 lg:h-screen lg:overflow-y-auto flex-col"></aside>
  <div class="flex-1 min-w-0 flex flex-col">
    <header class="bg-white/90 backdrop-blur border-b border-violet-100 sticky top-0 z-30 px-4 md:px-6 py-3 flex items-center gap-3">
      <button class="lg:hidden text-2xl" onclick="document.getElementById('side').classList.toggle('hidden')">☰</button>
      <span class="pill bg-emerald-50 text-emerald-700 border border-emerald-200 whitespace-nowrap">● Admin Online</span>
      <input id="globalSearch" class="inp max-w-xl hide-m" placeholder="Search products, orders, customers..." oninput="globalSearch(this.value)">
      <div class="ml-auto flex items-center gap-3">
        <a href="index.html" target="_blank" class="btn2 hide-m whitespace-nowrap">View my website ↗</a>
        <button class="relative btn2 px-3" onclick="go('notifications')" title="Notifications">🔔<span id="bellCount" class="hidden absolute -top-1 -right-1 bg-rose-600 text-white text-[10px] rounded-full px-1.5">0</span></button>
        <div class="flex items-center gap-2">
          <div class="w-9 h-9 rounded-full bg-violet-200 grid place-items-center font-bold text-violet-800" id="avatar">A</div>
          <div class="hide-m leading-tight cursor-pointer" onclick="go('profile')"><div class="font-bold text-sm" id="whoName">Super Admin</div><div class="text-xs text-violet-900/60" id="whoMail"></div></div>
          <button class="text-sm font-bold text-rose-600 ml-2" onclick="doLogout()">Logout</button>
        </div>
      </div>
    </header>
    <main id="main" class="p-4 md:p-6 space-y-6"></main>
  </div>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="card w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6" id="modalBody"></div></div>
<div id="toast"></div>

<script>
/* ============ CONFIG ============ */
const ADMIN_EMAIL='mrsanfuivlogs@gmail.com';
const firebaseConfig={apiKey:"AIzaSyDAJ_vKVVriilP29N__xKGQkrKxZqM7_AU",authDomain:"zavra-7ee42.firebaseapp.com",projectId:"zavra-7ee42",storageBucket:"zavra-7ee42.firebasestorage.app",messagingSenderId:"922510514582",appId:"1:922510514582:web:2c9455278ce38"};
const FB_OK=typeof firebase!=='undefined';
if(FB_OK){firebase.initializeApp(firebaseConfig)}else{document.addEventListener('DOMContentLoaded',()=>{show('login');loginMsg('Firebase could not load. Check your internet connection and reload the page.')})}
const auth=FB_OK?firebase.auth():null;
const db=FB_OK?firebase.firestore():null;
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN');
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display='none',2600)}
function closeModal(){$('#modal').classList.remove('open')}
function openModal(html){$('#modalBody').innerHTML=html;$('#modal').classList.add('open')}

/* ============ DATA (Firestore only, no sample data) ============ */
const S={view:'dashboard',sub:'',data:{returns:[],categories:[],products:[],orders:[],coupons:[],customers:[],banners:[],ads:[],gateways:[],delivery:[],activity:[],bulk:[],tickets:[]},loaded:false,q:''};
const COL={returns:'returns',categories:'categories',products:'products',orders:'orders',coupons:'coupons',customers:'customers',banners:'banners',ads:'ads',bulk:'bulkcat',activity:'admin_activity',tickets:'tickets'};
async function loadAll(){
  const jobs=Object.entries(COL).map(async([k,c])=>{try{const sn=await db.collection(c).get();S.data[k]=sn.docs.map(d=>({_id:d.id,...d.data()}))}catch(e){S.data[k]=[];console.warn(c,e.message)}});
  try{const g=await db.collection('store').doc('gateways').get();S.data.gateways=(g.exists&&g.data().list)||[]}catch(e){}
  try{const r=await db.collection('store').doc('regions').get();S.data.regions=(r.exists&&r.data().list)||[]}catch(e){S.data.regions=[]}
  try{const d=await db.collection('store').doc('delivery').get();S.data.delivery=(d.exists&&d.data().list)||[]}catch(e){}
  await loadSite();
  S.loaded=true;
}
async function saveSetting(docId,list){await db.collection('store').doc(docId).set({list},{merge:true})}
function logActivity(text){try{db.collection('admin_activity').add({text,by:auth.currentUser&&auth.currentUser.email||'',at:new Date().toISOString()})}catch(e){}}

/* ============ AUTH ============ */
function show(which){$('#login').style.display=which==='login'?'grid':'none';$('#app').style.display=which==='app'?'flex':'none'}
function showPhone(on){$('#phonePanel').style.display=on?'flex':'none'}
async function googleLogin(){loginMsg('');try{const r=await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());if(r.user&&r.user.email!==ADMIN_EMAIL){await auth.signOut();loginMsg('This Google account is not an admin.')}}catch(err){loginMsg('Google login failed: '+(err.message||err.code))}}
function pwToggle(){const i=$('#adminPassword');i.type=i.type==='password'?'text':'password'}
function loginMsg(m){const el=$('#loginMsg');el.textContent=m;el.style.display=m?'block':'none'}
async function emailLogin(e){e.preventDefault();loginMsg('');const email=$('#adminEmail').value.trim().toLowerCase(),pw=$('#adminPassword').value;
  if(email!==ADMIN_EMAIL)return loginMsg('This account is not an admin. Sign in with the authorized admin email.');
  try{await auth.setPersistence($('#remember').checked?firebase.auth.Auth.Persistence.LOCAL:firebase.auth.Auth.Persistence.SESSION);await auth.signInWithEmailAndPassword(email,pw)}
  catch(err){loginMsg(err.code==='auth/wrong-password'||err.code==='auth/invalid-credential'?'Wrong password.':err.code==='auth/user-not-found'?'No account for this email yet.':'Login failed: '+(err.message||err.code))}}
async function resetPassword(){const email=$('#adminEmail').value.trim();if(!email)return loginMsg('Enter your email first');try{await auth.sendPasswordResetEmail(email);loginMsg('Password reset link sent to '+email)}catch(err){loginMsg('Reset failed: '+(err.message||err.code))}}
let confirmation=null,recaptcha=null;
async function sendPhoneOtp(e){e.preventDefault();loginMsg('');const phone=$('#adminPhone').value.replace(/\s/g,'');
  try{if(!recaptcha){recaptcha=new firebase.auth.RecaptchaVerifier('recaptcha',{size:'invisible'})}
    confirmation=await auth.signInWithPhoneNumber(phone,recaptcha);$('#otpRow').classList.remove('hidden');$('#verifyBtn').classList.remove('hidden');$('#phoneBtn').textContent='Resend OTP';loginMsg('OTP sent to '+phone)}
  catch(err){loginMsg('OTP failed: '+(err.message||err.code));try{recaptcha&&recaptcha.clear()}catch(x){};recaptcha=null}}
async function verifyPhoneOtp(){const code=$('#adminOtp').value.trim();if(!confirmation)return loginMsg('Send OTP first');
  try{const r=await confirmation.confirm(code);if(!r.user||r.user.email!==ADMIN_EMAIL){await auth.signOut();return loginMsg('This phone is not linked to the admin account. Link it in Admin Profile after email login.')}}
  catch(err){loginMsg('Wrong or expired OTP')}}
async function doLogout(){await auth.signOut();toast('Logged out')}
if(auth)auth.onAuthStateChanged(async u=>{
  if(!u){show('login');return}
  if(u.email!==ADMIN_EMAIL){await auth.signOut();show('login');loginMsg('This account is not an admin.');return}
  show('app');$('#whoName').textContent='Super Admin';$('#whoMail').textContent=u.email;$('#avatar').textContent='A';
  await loadAll();render();
});

/* ============ NAV ============ */
const NAV=[
 {id:'dashboard',label:'Dashboard',icon:'🏠'},
 {id:'products',label:'Products',icon:'📦',subs:[['all','All Products'],['add','Add Product']]},
 {id:'categories',label:'Categories',icon:'🗂️'},
 {id:'orders',label:'Orders',icon:'🛒',subs:[['all','All Orders']]},
 {id:'returns',label:'Returns & Refunds',icon:'🔄'},
 {id:'customers',label:'Customers',icon:'👥'},
 {id:'payments',label:'Payments & Delivery',icon:'💳',subs:[['payments','Payment Gateway'],['delivery','Delivery Partners']]},
 {id:'ads',label:'Ads Campaign',icon:'📣'},
 {id:'women',label:'Women Section',icon:'👗'},
 {id:'men',label:'Men Section',icon:'👔'},
 {id:'baby',label:'Baby & Toys',icon:'🧸'},
 {id:'kitchen',label:'Kitchen & Home',icon:'🍳'},
 {id:'wholesale',label:'Wholesale & Bulk',icon:'🤝'},
 {id:'inventory',label:'Inventory',icon:'🏷️'},
 {id:'coupons',label:'Coupons & Discounts',icon:'🎟️'},
 {id:'reports',label:'Reports',icon:'📊'},
 {id:'notifications',label:'Notifications',icon:'🔔'},
 {id:'support',label:'Support & Complaints',icon:'🎧',subs:[['all','All Tickets'],['new','New Complaints'],['resolved','Resolved Tickets'],['feedback','Feedbacks']]},
 {id:'profile',label:'Admin Profile',icon:'👤'},
 {id:'regions',label:'Regions & Currency',icon:'🌍'},
 {id:'settings',label:'Settings',icon:'⚙️'}
];
function go(v,sub){S.view=v;S.sub=sub||'';render();window.scrollTo(0,0);document.getElementById('side').classList.add('hidden')}
function renderSide(){
  $('#side').innerHTML=`<div class="px-5 pt-6 pb-4 text-center border-b border-white/10">
    <img src="assets/brand/zavra-logo.png" alt="ZAVRA" class="w-14 h-14 mx-auto rounded-xl bg-white object-contain">
    <div class="font-extrabold tracking-widest text-lg mt-2">ZAVRA</div><div class="text-xs text-violet-200">Shop Smart, Live Better</div></div>
  <nav class="p-3 space-y-1 flex-1">${NAV.map(n=>`
    <button class="navi ${S.view===n.id?'on':''}" onclick="go('${n.id}')"><span>${n.icon}</span><span class="flex-1">${n.label}</span>${n.subs?'<span class="text-xs opacity-70">▾</span>':''}</button>

PAGES.returns=()=>{
  const R=S.data.returns;const ql=(S.q||'').toLowerCase();
  const shown=R.filter(x=>(S.rf==='all'||x.status===S.rf)&&(!ql||[x.id,x.orderId,x.customer].join(' ').toLowerCase().includes(ql)));
  const sel=R.find(x=>x._id===S.rsel)||shown[0]||null;
  const cnt=k=>k==='all'?R.length:R.filter(x=>x.status===k).length;
  const refunded=R.filter(x=>x.status==='Completed').reduce((t,x)=>t+(Number(x.amount)||0),0);
  const tc=(bg,label,val,note,icon)=>`<div class="rounded-2xl p-5 flex items-center gap-4" style="background:${bg}"><div class="w-16 h-16 rounded-2xl bg-white/60 grid place-items-center text-3xl">${icon}</div><div><div class="text-sm font-semibold text-violet-950/80">${label}</div><div class="text-2xl font-extrabold">${val}</div><div class="text-xs font-bold text-violet-900/50">${note}</div></div></div>`;
  const chip=(k,l)=>`<button class="${S.rf===k?'btn':'btn2'}" onclick="S.rf='${k}';render()">${l} (${cnt(k)})</button>`;
  const rows=shown.map(x=>`<tr class="hover:bg-violet-50/40 cursor-pointer ${sel&&sel._id===x._id?'bg-violet-50':''}" onclick="S.rsel='${x._id}';render()"><td><input type="checkbox" class="w-4 h-4 accent-violet-700" onclick="event.stopPropagation()"></td><td class="font-bold">${esc(x.id||x._id)}</td><td>#${esc(x.orderId||'')}</td><td>${esc(x.customer||'')}</td><td>${esc(x.product||'')}</td><td>${esc(x.reason||'')}</td><td><span class="pill ${RSTAT[x.status]||'bg-slate-100 text-slate-700'}">${esc(x.status||'Pending')}</span></td><td class="text-sm">${esc(x.date||'')}</td><td><button class="btnx" onclick="event.stopPropagation();delReturn('${x._id}')">🗑</button></td></tr>`).join('');
  const detail=sel?`<div class="flex gap-3">${sel.img?`<img src="${esc(sel.img)}" class="w-20 h-24 rounded-xl object-cover" alt="">`:'<div class="w-20 h-24 rounded-xl bg-violet-50"></div>'}<div class="flex-1"><div class="font-extrabold">${esc(sel.product||'')}</div><div class="text-xs text-violet-900/60">Order ID: #${esc(sel.orderId||'')}</div><span class="pill ${RSTAT[sel.status]||''} mt-2">${esc(sel.status||'Pending')}</span></div></div>
    <div class="mt-4 text-sm space-y-1"><div><b>Return ID:</b> ${esc(sel.id||sel._id)}</div><div><b>Requested On:</b> ${esc(sel.date||'')}</div><div><b>Reason:</b> ${esc(sel.reason||'')}</div><div><b>Customer:</b> ${esc(sel.customer||'')}</div><div><b>Phone:</b> ${esc(sel.phone||'—')}</div></div>
    <div class="mt-4 p-3 rounded-xl bg-emerald-50"><div class="text-sm font-bold">Refund Amount</div><div class="text-xl font-extrabold">${money(sel.amount)}</div></div>
    <div class="grid grid-cols-2 gap-2 mt-4"><button class="btn3" onclick="setReturnStatus('${sel._id}','Approved')">✓ Approve Return</button><button class="btnx py-2" onclick="setReturnStatus('${sel._id}','Rejected')">✕ Reject Return</button></div>
    <button class="btn w-full mt-2" onclick="setReturnStatus('${sel._id}','Completed')">🏦 Process Refund</button>`:empty('Select a return to see its details.');
  return head('Returns &amp; Refund Management','Manage return requests and process refunds easily','<button class="btn2" onclick="toast(\'Return policy page will be added with the website settings step\')">📘 Return Policy</button><button class="btn2" onclick="go(\'settings\')">⚙ Refund Settings</button><button class="btn" onclick="toast(\'Export will be added with the reports step\')">⬇ Export Report</button>')+`
  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
    ${tc('linear-gradient(120deg,#dbeafe,#bfdbfe)','Total Returns',R.length||'',R.length?'Live from store':'No returns yet','📦')}
    ${tc('linear-gradient(120deg,#bbf7d0,#86efac)','Approved Returns',cnt('Approved')||'','Approved requests','✅')}
    ${tc('linear-gradient(120deg,#fde68a,#fdba74)','Pending Returns',cnt('Pending')||'','Waiting for action','⏱')}
    ${tc('linear-gradient(120deg,#ede9fe,#ddd6fe)','Total Refunded',refunded?money(refunded):'','Completed refunds','₹')}
  </div>
  <div class="flex flex-wrap items-center gap-2">${chip('all','All Returns')}${chip('Pending','Pending')}${chip('Approved','Approved')}${chip('Rejected','Rejected')}${chip('Completed','Completed')}</div>
  <div class="grid grid-cols-1 xl:grid-cols-3 gap-4">
    <div class="xl:col-span-2 space-y-3">
      <div class="card p-4 flex flex-wrap items-center gap-3"><input class="inp flex-1 min-w-[200px]" placeholder="Search by Order ID, Customer Name..." value="${esc(S.q||'')}" oninput="S.q=this.value;render()"><button class="btn" onclick="render()">▼ Filter</button></div>
      <div class="card overflow-hidden">${R.length?`<div class="scroll-x"><table class="t"><thead><tr><th><input type="checkbox" class="w-4 h-4 accent-violet-700"></th><th>Return ID</th><th>Order ID</th><th>Customer</th><th>Product</th><th>Reason</th><th>Status</th><th>Requested On</th><th>Action</th></tr></thead><tbody>${rows||'<tr><td colspan="9">'+empty('No returns match this filter.')+'</td></tr>'}</tbody></table></div><div class="p-4 text-sm text-violet-900/70">Showing ${shown.length} of ${R.length} returns</div>`:empty('No return requests yet. Customer returns appear here.')}</div>
    </div>
    <div class="card p-5"><div class="flex justify-between items-center mb-3"><h3 class="font-extrabold">Return Details</h3></div>${detail}</div>
  </div>
  <div class="card p-4 flex flex-wrap items-center justify-between gap-2"><div class="text-sm">ⓘ <b>Need Help?</b> Contact our support team for return &amp; refund assistance.</div><button class="btn2" onclick="go('settings')">🎧 Contact Support</button></div>`;
};
async function setReturnStatus(id,st){try{await db.collection('returns').doc(id).update({status:st});const x=S.data.returns.find(r=>r._id===id);if(x)x.status=st;if(st==='Completed'){try{await db.collection('refunds').add({returnId:id,amount:(x&&x.amount)||0,at:new Date().toISOString()})}catch(e){}}logActivity('Return '+((x&&x.id)||id)+' set to '+st);render();toast('Return updated')}catch(err){toast('Update failed: '+(err.message||err.code))}}
async function delReturn(id){if(!confirm('Delete this return?'))return;try{await db.collection('returns').doc(id).delete();S.data.returns=S.data.returns.filter(r=>r._id!==id);render();toast('Return deleted')}catch(err){toast('Delete failed')}}
function orderRows(list){return list.length?`<div class="scroll-x"><table class="t"><thead><tr><th>#</th><th>Order ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th><th>Update</th></tr></thead><tbody>${list.map((x,i)=>`<tr><td>${i+1}</td><td class="font-bold">#${esc(x.orderId||x._id)}</td><td>${esc(x.customer||'')}</td><td>${Number(x.items?.length||x.qty)||0}</td><td><b>${money(x.total)}</b></td><td>${statusPill(x.status)}</td><td>${esc(x.date||'')}</td><td><select class="inp py-1" onchange="setOrderStatus('${x._id}',this.value)">${['Pending','Processing','Shipped','Delivered','Cancelled','Returned'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`:empty('No orders yet. Orders from the website appear here.')}
S.of=S.of||{st:'',sel:''};
PAGES.orders=()=>{
  if(S.sub==='returns')return PAGES.returns();
  const O=S.data.orders;const f=S.of;const ql=(S.q||'').toLowerCase();
  const ST=['Pending','Processing','Shipped','Delivered','Cancelled'];
  const list=O.filter(x=>(!f.st||x.status===f.st)&&(!ql||[x.orderId,x._id,x.customer].join(' ').toLowerCase().includes(ql)));
  const sel=O.find(x=>x._id===f.sel)||list[0]||null;
  const cnt=k=>k?O.filter(x=>x.status===k).length:O.length;
  const tc=(bg,label,val,note,icon)=>`<div class="rounded-2xl p-5 flex items-center gap-4" style="background:${bg}"><div class="w-16 h-16 rounded-2xl bg-white/60 grid place-items-center text-3xl">${icon}</div><div><div class="text-sm font-semibold text-violet-950/80">${label}</div><div class="text-2xl font-extrabold">${val}</div><div class="text-xs font-bold text-violet-900/50">${note}</div></div></div>`;
  const chip=(k,l)=>`<button class="${f.st===k?'btn':'btn2'}" onclick="S.of.st='${k}';render()">${l} (${cnt(k)})</button>`;
  const sp=v=>{const m={Delivered:'bg-emerald-50 text-emerald-700',Processing:'bg-sky-50 text-sky-700',Shipped:'bg-violet-50 text-violet-700',Pending:'bg-amber-50 text-amber-700',Cancelled:'bg-rose-50 text-rose-700',Returned:'bg-fuchsia-50 text-fuchsia-700'};return `<span class="pill ${m[v]||'bg-slate-100 text-slate-700'}">${esc(v||'Pending')}</span>`};
  const rows=list.map(x=>`<tr class="hover:bg-violet-50/40 cursor-pointer ${sel&&sel._id===x._id?'bg-violet-50':''}" onclick="S.of.sel='${x._id}';render()"><td><input type="checkbox" class="w-4 h-4 accent-violet-700" onclick="event.stopPropagation()"></td><td class="font-bold">#${esc(x.orderId||x._id)}</td><td>${esc(x.customer||'')}</td><td><b>${money(x.total)}</b></td><td class="text-sm">${esc(x.payment||'—')}</td><td>${sp(x.status)}</td><td class="text-sm">${esc(x.date||'')}</td><td><div class="flex gap-2"><button class="btn2 px-2 py-1" onclick="event.stopPropagation();openOrder('${x._id}')">👁</button><select class="inp py-1 max-w-[130px]" onclick="event.stopPropagation()" onchange="setOrderStatus('${x._id}',this.value)">${[...ST,'Returned'].map(v=>`<option ${v===x.status?'selected':''}>${v}</option>`).join('')}</select></div></td></tr>`).join('');
  const items=sel&&Array.isArray(sel.items)?sel.items:[];
  const sub=items.reduce((t,i)=>t+(Number(i.price)||0)*(Number(i.qty)||1),0);
  const detail=sel?`<div class="flex items-center justify-between"><div class="font-extrabold text-lg">#${esc(sel.orderId||sel._id)}</div>${sp(sel.status)}</div><div class="text-xs text-violet-900/60 mt-1">${esc(sel.date||'')} · ${esc(sel.payment||'')}</div>
    <div class="grid grid-cols-2 gap-3 mt-4 text-sm"><div><div class="font-bold mb-1">Customer</div>${esc(sel.customer||'')}<div class="text-xs text-violet-900/60">${esc(sel.phone||'')}</div><div class="text-xs text-violet-900/60">${esc(sel.email||'')}</div></div><div><div class="font-bold mb-1">Shipping Address</div>${esc(sel.address||'—')}</div></div>
    <div class="mt-4 font-bold">Ordered Items (${items.length})</div>${items.length?items.map(i=>`<div class="flex justify-between py-2 border-b border-violet-50 text-sm"><span>${esc(i.name||'')} × ${Number(i.qty)||1}</span><b>${money((Number(i.price)||0)*(Number(i.qty)||1))}</b></div>`).join(''):'<div class="text-sm text-violet-900/60 py-2">No item details</div>'}
    <div class="mt-3 text-sm space-y-1"><div class="flex justify-between"><span>Subtotal</span><span>${money(sub)}</span></div><div class="flex justify-between"><span>Shipping</span><span>${money(Number(sel.shipping)||0)}</span></div><div class="flex justify-between font-extrabold text-base"><span>Total Amount</span><span>${money(sel.total)}</span></div></div>
    <div class="mt-4 font-bold">Order Timeline</div><div class="text-sm space-y-1 mt-1"><div>✔ Order Placed <span class="text-violet-900/60">${esc(sel.date||'')}</span></div><div class="${['Shipped','Delivered'].includes(sel.status)?'':'opacity-40'}">✔ Shipped</div><div class="${sel.status==='Delivered'?'':'opacity-40'}">✔ Delivered</div></div>
    <div class="grid grid-cols-3 gap-2 mt-4"><button class="btn2" onclick="window.print()">🖨 Print Invoice</button><a class="btn2 text-center" href="${sel.phone?'tel:'+esc(sel.phone):'#'}">📞 Contact</a><button class="btnx py-2" onclick="toast('Refunds are handled in Returns & Refunds')">↺ Refund Order</button></div>`:empty('Select an order to see its details.');
  return head('Order Management','Manage customer orders and track delivery status','<button class="btn" onclick="toast(\'Export will be added with the reports step\')">⬇ Export Orders</button>')+`
  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
    ${tc('linear-gradient(120deg,#e9d5ff,#d8b4fe)','Total Orders',O.length||'',O.length?'Live from store':'No orders yet','🛍')}
    ${tc('linear-gradient(120deg,#bbf7d0,#86efac)','Delivered',cnt('Delivered')||'','Completed orders','✅')}
    ${tc('linear-gradient(120deg,#fde68a,#fdba74)','Pending',cnt('Pending')||'','Waiting for action','⏱')}
    ${tc('linear-gradient(120deg,#bfdbfe,#93c5fd)','Cancelled',cnt('Cancelled')||'','Cancelled orders','🔄')}
  </div>
  <div class="flex flex-wrap items-center gap-2">${chip('','All Orders')}${ST.map(v=>chip(v,v)).join('')}</div>
  <div class="card p-4 flex flex-wrap items-center gap-3"><input class="inp flex-1 min-w-[220px]" placeholder="Search by Order ID, Customer Name..." value="${esc(S.q||'')}" oninput="S.q=this.value;render()"><select class="inp" style="max-width:200px" onchange="S.of.st=this.value;render()"><option value="">All Status</option>${ST.map(v=>`<option ${f.st===v?'selected':''}>${v}</option>`).join('')}</select><button class="btn" onclick="render()">Filter</button></div>
  <div class="grid grid-cols-1 xl:grid-cols-3 gap-4">
    <div class="card overflow-hidden xl:col-span-2">${O.length?`<div class="scroll-x"><table class="t"><thead><tr><th><input type="checkbox" class="w-4 h-4 accent-violet-700"></th><th>Order ID</th><th>Customer</th><th>Amount</th><th>Payment</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody>${rows||'<tr><td colspan="8">'+empty('No orders match this filter.')+'</td></tr>'}</tbody></table></div><div class="p-4 text-sm text-violet-900/70">Showing ${list.length} of ${O.length} orders</div>`:empty('No orders yet. Orders from the website appear here.')}</div>
    <div class="card p-5"><div class="flex justify-between items-center mb-3"><h3 class="font-extrabold">Order Details</h3></div>${detail}</div>
  </div>`;
};
PAGES.customers=()=>{
  const c=S.data.customers,o=S.data.orders;const ql=(S.q||'').toLowerCase();const f=S.cf||(S.cf={seg:'',status:'',region:''});
  const ordersOf=x=>o.filter(q=>(q.customer&&q.customer===x.name)||(q.phone&&q.phone===x.phone)).length;
  const list=c.filter(x=>(!ql||[x.name,x.email,x.phone].join(' ').toLowerCase().includes(ql))&&(!f.status||(f.status==='Active'?!x.blocked:!!x.blocked))&&(!f.region||x.city===f.region));
  const regions=[...new Set(c.map(x=>x.city).filter(Boolean))];
  const act=S.data.activity.slice().sort((x,y)=>String(y.at).localeCompare(String(x.at))).slice(0,4);
  const tc=(bg,label,val,note,icon)=>`<div class="rounded-2xl p-5 flex items-center gap-4" style="background:${bg}"><div class="w-16 h-16 rounded-2xl bg-white/60 grid place-items-center text-3xl">${icon}</div><div><div class="text-sm font-semibold text-violet-950/80">${label}</div><div class="text-2xl font-extrabold">${val}</div><div class="text-xs font-bold text-violet-900/50">${note}</div></div></div>`;
  const ini=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  const rows=list.map((x,i)=>`<tr class="hover:bg-violet-50/40"><td><input type="checkbox" class="w-4 h-4 accent-violet-700"></td><td>${i+1}</td><td><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-violet-100 text-violet-700 font-extrabold grid place-items-center">${esc(ini(x.name))}</div><div class="font-bold">${esc(x.name||'')}</div></div></td><td class="text-sm">${esc(x.email||'')}</td><td>${esc(x.phone||'')}</td><td>${esc(x.city||'—')}</td><td><label class="switch"><input type="checkbox" ${x.blocked?'':'checked'} onchange="toggleBlock('${x._id}',!this.checked)"><span class="slider"></span></label> <span class="text-sm font-bold ${x.blocked?'text-rose-600':'text-emerald-700'}">${x.blocked?'Blocked':'Active'}</span></td><td>${ordersOf(x)}</td><td class="text-sm">${esc(x.joined||'')}</td><td><div class="flex gap-2"><button class="btn2 px-2 py-1" onclick="openCustomer('${x._id}')">👁</button><button class="btn px-2 py-1" onclick="customerForm('${x._id}')">✎</button><button class="btnx" onclick="delCustomer('${x._id}')">🗑</button></div></td></tr>`).join('');
  return head('Customers &amp; Users Management','Manage your customers, users and their activities','<button class="btn2" onclick="toast(\'Import users will be added with the upload step\')">⬆ Import Users</button><button class="btn" onclick="customerForm()">+ Add Customer</button>')+`
  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
    ${tc('linear-gradient(120deg,#e9d5ff,#d8b4fe)','Total Customers',c.length||'',c.length?'Live from store':'No customers yet','👥')}
    ${tc('linear-gradient(120deg,#bbf7d0,#86efac)','Active Users',c.filter(x=>!x.blocked).length||'','Not blocked','🛒')}
    ${tc('linear-gradient(120deg,#fed7aa,#fdba74)','New Signups',c.filter(x=>x.joined&&String(x.joined).slice(0,7)===new Date().toISOString().slice(0,7)).length||'','This month','👤')}
    ${tc('linear-gradient(120deg,#bfdbfe,#93c5fd)','Blocked Users',c.filter(x=>x.blocked).length||'','Blocked accounts','⛔')}
  </div>
  <div class="card p-4 flex flex-wrap items-center gap-3">
    <input class="inp flex-1 min-w-[220px]" placeholder="Search by name, email or phone..." value="${esc(S.q||'')}" oninput="S.q=this.value;render()">
    <select class="inp" style="max-width:180px" onchange="S.cf.status=this.value;render()"><option value="">All Status</option><option ${f.status==='Active'?'selected':''}>Active</option><option ${f.status==='Blocked'?'selected':''}>Blocked</option></select>
    <select class="inp" style="max-width:200px" onchange="S.cf.region=this.value;render()"><option value="">All Regions</option>${regions.map(r=>`<option ${f.region===r?'selected':''}>${esc(r)}</option>`).join('')}</select>
    <button class="btn" onclick="render()">Filter</button><button class="btn2" onclick="exportCustomers()">⬇ Export</button>
  </div>
  <div class="grid grid-cols-1 xl:grid-cols-4 gap-4">
    <div class="card overflow-hidden xl:col-span-3">${c.length?`<div class="scroll-x"><table class="t"><thead><tr><th><input type="checkbox" class="w-4 h-4 accent-violet-700"></th><th>#</th><th>Customer Name</th><th>Email</th><th>Phone</th><th>Location</th><th>Status</th><th>Total Orders</th><th>Joined On</th><th>Actions</th></tr></thead><tbody>${rows||'<tr><td colspan="10">'+empty('No customers match this filter.')+'</td></tr>'}</tbody></table></div><div class="p-4 text-sm text-violet-900/70">Showing ${list.length} of ${c.length} customers</div>`:empty('No customers yet. Customers appear here after they register on the website.')}</div>
    <div class="space-y-4">
      <div class="card p-5"><div class="font-extrabold mb-3">Quick Actions</div><div class="grid gap-2"><button class="btn2 text-left" onclick="customerForm()">👤 Add Customer</button><button class="btn2 text-left" onclick="toast('Newsletter needs an email service. Not connected yet.')">✉ Send Newsletter</button><button class="btn2 text-left" onclick="exportCustomers()">⬇ Export Customers</button><button class="btn2 text-left" onclick="toast('Segments will be added with the marketing step')">🧩 Manage Segments</button></div></div>
      <div class="card p-5"><div class="font-extrabold mb-3">Recent Activity</div>${act.length?act.map(x=>`<div class="py-2 border-b border-violet-50 last:border-0"><div class="text-sm font-bold">${esc(x.text||'')}</div><div class="text-xs text-violet-900/60">${esc(x.at||'')}</div></div>`).join(''):'<div class="text-sm text-violet-900/60">No activity yet</div>'}</div>
    </div>
  </div>`;
};
async function toggleBlock(id,blocked){try{await db.collection('customers').doc(id).update({blocked});const x=S.data.customers.find(c=>c._id===id);if(x)x.blocked=blocked;render();toast(blocked?'Customer blocked':'Customer unblocked')}catch(err){toast('Update failed');render()}}
function customerForm(id){const x=(id&&S.data.customers.find(c=>c._id===id))||{};openModal(`<div class="flex justify-between mb-4"><h2 class="text-xl font-extrabold">${id?'Edit customer':'New customer'}</h2><button onclick="closeModal()" class="text-2xl">×</button></div><form class="grid md:grid-cols-2 gap-3" onsubmit="saveCustomer(event,'${id||''}')"><div><label class="lbl">Name</label><input class="inp" name="name" required value="${esc(x.name||'')}"></div><div><label class="lbl">Email</label><input class="inp" name="email" type="email" value="${esc(x.email||'')}"></div><div><label class="lbl">Phone</label><input class="inp" name="phone" value="${esc(x.phone||'')}"></div><div><label class="lbl">City</label><input class="inp" name="city" value="${esc(x.city||'')}"></div><div class="md:col-span-2 flex justify-end gap-2"><button type="button" class="btn2" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Save</button></div></form>`)}
async function saveCustomer(e,id){e.preventDefault();const f=new FormData(e.target);const d={name:f.get('name'),email:f.get('email')||'',phone:f.get('phone')||'',city:f.get('city')||'',blocked:!!(id&&S.data.customers.find(c=>c._id===id)?.blocked),joined:new Date().toISOString().slice(0,10)};
  try{if(id){await db.collection('customers').doc(id).update(d);Object.assign(S.data.customers.find(c=>c._id===id)||{},d)}else{const r=await db.collection('customers').add(d);S.data.customers.unshift({_id:r.id,...d})}closeModal();render();toast('Customer saved')}catch(err){toast('Save failed: '+(err.message||err.code))}}
async function delCustomer(id){if(!confirm('Delete this customer?'))return;try{await db.collection('customers').doc(id).delete();S.data.customers=S.data.customers.filter(c=>c._id!==id);render();toast('Customer deleted')}catch(err){toast('Delete failed')}}

async function changeAdminPassword(e){e.preventDefault();const cur=$('#pwCur').value,nw=$('#pwNew').value,cf=$('#pwConf').value;

const TK_ST={'New':'bg-sky-50 text-sky-700','In Progress':'bg-emerald-50 text-emerald-700','Pending':'bg-amber-50 text-amber-700','Resolved':'bg-emerald-50 text-emerald-700','Closed':'bg-slate-100 text-slate-700','Spam':'bg-rose-50 text-rose-700'};
function tkPill(map,s){return `<span class="pill ${map[s]||'bg-slate-100 text-slate-700'}">${esc(s||'—')}</span>`}
function tkDate(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
function tkTime(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function tkStats(){const t=S.data.tickets;const c=s=>t.filter(x=>x.status===s).length;const rated=t.filter(x=>Number(x.rating)>0);
  const avg=rated.length?rated.reduce((a,x)=>a+Number(x.rating),0)/rated.length:0;const resolved=c('Resolved')+c('Closed');const pending=c('New')+c('In Progress')+c('Pending');
  const frt=[];t.forEach(x=>{const a=(x.replies||[]).find(r=>r.by==='admin');if(a&&x.date){const h=(new Date(a.at)-new Date(x.date))/3600000;if(h>=0)frt.push(h)}});
  const art=frt.length?frt.reduce((a,b)=>a+b,0)/frt.length:0;
  const sat=rated.length?Math.round(rated.filter(x=>Number(x.rating)>=4).length*100/rated.length):0;
  return {total:t.length,resolved,pending,avg,rated:rated.length,art,sat,resRate:t.length?Math.round(resolved*100/t.length):0,c}}
function supList(){const T=S.data.tickets,sp=S.sp;
  const base=S.sub==='new'?T.filter(x=>x.status==='New'):S.sub==='resolved'?T.filter(x=>x.status==='Resolved'||x.status==='Closed'):S.sub==='feedback'?T.filter(x=>Number(x.rating)>0):T;
  const q=(sp.q||'').toLowerCase();
  return base.filter(x=>(!sp.st||x.status===sp.st)&&(!sp.pr||x.priority===sp.pr)&&(!sp.stt||x.status===sp.stt)&&(!q||[x.id,x.customer,x.subject].join(' ').toLowerCase().includes(q)))}
function supChip(v){S.sp.st=v;S.sp.page=1;render()}
function supPage(n){S.sp.page=n;render()}
function supSel(id){S.sp.sel=id;render()}
function supChk(id){const a=S.sp.chk;const i=a.indexOf(id);if(i<0)a.push(id);else a.splice(i,1);render()}
function supAllToggle(){const ids=supList().map(x=>x._id);S.sp.chk=(S.sp.chk.length===ids.length&&ids.length)?[]:ids;render()}
async function supBulk(st){const ids=S.sp.chk.slice();if(!ids.length)return;try{await Promise.all(ids.map(id=>db.collection('tickets').doc(id).update({status:st})));ids.forEach(id=>{const x=S.data.tickets.find(t=>t._id===id);if(x)x.status=st});S.sp.chk=[];logActivity(ids.length+' tickets set to '+st);render();toast('Tickets updated')}catch(err){toast('Update failed: '+(err.message||err.code))}}
async function setTicketStatus(id,st){try{await db.collection('tickets').doc(id).update({status:st});const x=S.data.tickets.find(t=>t._id===id);if(x)x.status=st;logActivity('Ticket '+((x&&x.id)||id)+' set to '+st);render();toast('Status updated')}catch(err){toast('Update failed: '+(err.message||err.code))}}
async function sendTicketReply(id){const text=(($('#tkReply')||{}).value||'').trim();if(!text)return toast('Type a reply first');
  const r={by:'admin',text,at:new Date().toISOString()};const x=S.data.tickets.find(t=>t._id===id);const upd={replies:firebase.firestore.FieldValue.arrayUnion(r)};if(x&&x.status==='New')upd.status='In Progress';
  try{await db.collection('tickets').doc(id).update(upd);if(x){x.replies=(x.replies||[]).concat([r]);if(upd.status)x.status=upd.status}logActivity('Reply saved on ticket '+((x&&x.id)||id));render();toast('Reply saved. Sending email to the customer is not connected yet')}catch(err){toast('Send failed: '+(err.message||err.code))}}
function openTicketForm(){openModal(`<h3 class="text-xl font-extrabold mb-4">New Ticket</h3><form onsubmit="saveTicket(event)" class="grid gap-3">
<div><label class="lbl">Customer name</label><input id="tkName" class="inp" required></div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div><label class="lbl">Phone</label><input id="tkPhone" class="inp"></div><div><label class="lbl">Email</label><input id="tkEmail" type="email" class="inp"></div></div>
<div><label class="lbl">Subject</label><input id="tkSubj" class="inp" required></div>
<div><label class="lbl">Message</label><textarea id="tkMsg" class="inp" rows="4" required></textarea></div>
<div><label class="lbl">Priority</label><select id="tkPrio" class="inp"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
<div class="flex justify-end gap-2"><button type="button" class="btn2" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Create Ticket</button></div></form>`)}
async function saveTicket(e){e.preventDefault();const n=Date.now();const id='TKT-'+String(10000+(n%89999));
  const rec={id,customer:$('#tkName').value.trim(),phone:$('#tkPhone').value.trim(),email:$('#tkEmail').value.trim(),subject:$('#tkSubj').value.trim(),message:$('#tkMsg').value.trim(),priority:$('#tkPrio').value,status:'New',date:new Date().toISOString(),replies:[],rating:0};
  try{const ref=await db.collection('tickets').add(rec);S.data.tickets.unshift({_id:ref.id,...rec});logActivity('Ticket '+id+' created');closeModal();S.sp.sel=ref.id;render();toast('Ticket created')}catch(err){toast('Save failed: '+(err.message||err.code))}}
function exportTickets(){const L=supList();if(!L.length)return toast('No tickets to export');
  const rows=[['Ticket ID','Customer','Phone','Email','Subject','Priority','Status','Date','Rating']].concat(L.map(x=>[x.id,x.customer,x.phone,x.email,x.subject,x.priority,x.status,x.date,x.rating||'']));
  const csv=rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const l=document.createElement('a');l.href=u;l.download='zavra_tickets.csv';document.body.appendChild(l);l.click();l.remove();URL.revokeObjectURL(u)}
PAGES.support=()=>{

  const per=8,pages=Math.max(1,Math.ceil(L.length/per));const cur=Math.min(sp.page||1,pages);const rows=L.slice((cur-1)*per,cur*per);

  const tl=(label,val,sub,bg,ic,fg)=>`<div class="tile" style="background:${bg}"><div class="w-14 h-14 rounded-2xl grid place-items-center text-2xl bg-white/70">${ic}</div><div class="flex-1 min-w-0"><div class="text-sm text-violet-900/70">${label}</div><div class="text-2xl font-extrabold" style="color:${fg}">${val}</div><div class="text-xs font-bold text-violet-900/50">${sub}</div></div></div>`;

    :`<tr><td colspan="9">${empty(T.length?'No tickets match these filters.':'No support tickets yet. Tickets from customers will appear here.')}</td></tr>`;
  const pageBtns=Array.from({length:Math.min(pages,5)},(_,i)=>i+1).map(n=>`<button onclick="supPage(${n})" class="w-9 h-9 rounded-xl text-sm font-bold ${n===cur?'bg-[#6200EA] text-white':'bg-white border border-[#ddd3f3] text-violet-900'}">${n}</button>`).join('');
  const bulk=S.sp.chk.length?`<div class="flex flex-wrap items-center gap-2 p-3 bg-violet-50 rounded-xl"><span class="text-sm font-bold">${S.sp.chk.length} selected</span><button class="btn2 py-1" onclick="supBulk('Resolved')">Mark Resolved</button><button class="btn2 py-1" onclick="supBulk('Closed')">Close</button><button class="btn2 py-1" onclick="S.sp.chk=[];render()">Clear</button></div>`:'';
  const detail=sel?`<div class="p-5 space-y-4">
    <div class="flex items-center justify-between"><div class="text-xl font-extrabold">#${esc(sel.id||'')}</div>${tkPill(TK_PR,sel.priority)}</div>
    <div class="flex items-center gap-3 border-b border-violet-100 pb-3"><div class="w-12 h-12 rounded-full bg-violet-100 text-violet-700 font-bold grid place-items-center">${esc((sel.customer||'?').charAt(0).toUpperCase())}</div><div class="flex-1 min-w-0"><div class="font-bold">${esc(sel.customer||'—')}</div><div class="text-xs text-violet-900/70">📞 ${esc(sel.phone||'Not set')}</div><div class="text-xs text-violet-900/70 truncate">✉ ${esc(sel.email||'Not set')}</div></div><div class="text-xs text-right">${tkTime(sel.date)}</div></div>

    <div><label class="lbl">Change status</label><select class="inp" onchange="setTicketStatus('${sel._id}',this.value)">${['New','In Progress','Pending','Resolved','Closed','Spam'].map(o=>`<option ${sel.status===o?'selected':''}>${o}</option>`).join('')}</select></div>
    <div><textarea id="tkReply" class="inp" rows="3" placeholder="Type your reply..."></textarea>
    <div class="flex items-center justify-between mt-2"><button class="btn2" disabled style="opacity:.6" title="Attachments need storage. Not connected yet">📎 Attach</button><button class="btn" onclick="sendTicketReply('${sel._id}')">➤ Send Reply</button></div></div>
  </div>`:`<div class="p-5">${empty('Select a ticket to see its details and reply.')}</div>`;
  return head('🎧 Support &amp; Customer Complaints Management','Handle customer issues, provide support and resolve complaints',
    `<button class="btn2" onclick="toast('Support settings are not connected yet')">⚙ Support Settings</button><button class="btn2" onclick="toast('Email templates are not connected yet')">✉ Email Templates</button><button class="btn" onclick="openTicketForm()">＋ New Ticket</button>`)+`
  <div class="grid grid-cols-2 xl:grid-cols-4 gap-4">
    ${tl('Total Tickets',String(st.total).padStart(2,'0'),st.total?'All tickets':'No tickets yet','#e8f0ff','🎧','#1d4ed8')}
    ${tl('Resolved',String(st.resolved).padStart(2,'0'),st.resolved?'Resolved and closed':'No resolved tickets yet','#e7f9ee','✅','#15803d')}
    ${tl('Pending',String(st.pending).padStart(2,'0'),st.pending?'New, in progress or pending':'Nothing pending','#fff3e2','⏰','#c2410c')}
    ${tl('Customer Rating',st.rated?st.avg.toFixed(1)+'/5':'0.0/5',st.rated?st.rated+' rated tickets':'No ratings yet','#f1e9ff','⭐','#6200EA')}
  </div>
  <div class="grid grid-cols-1 xl:grid-cols-[1fr_380px] gap-4 items-start">
    <div class="space-y-4 min-w-0">
      <div class="flex flex-wrap gap-2">${chip('','All Tickets',st.total)}${chip('New','New',st.c('New'))}${chip('In Progress','In Progress',st.c('In Progress'))}${chip('Resolved','Resolved',st.c('Resolved'))}${chip('Closed','Closed',st.c('Closed'))}${chip('Spam','Spam',st.c('Spam'))}</div>
      <div class="flex flex-wrap gap-2">
        <div class="flex-1 min-w-[220px] flex items-center gap-2 bg-white border border-[#ddd3f3] rounded-xl px-3"><span>🔍</span><input class="w-full py-2.5 outline-none text-sm" placeholder="Search tickets by ID, customer name..." value="${esc(sp.q||'')}" onchange="S.sp.q=this.value;S.sp.page=1;render()"></div>
        <select class="inp w-auto" onchange="S.sp.pr=this.value;S.sp.page=1;render()">${opt(['','High','Medium','Low'],sp.pr).replace('value=""','value=""')}</select>
        <select class="inp w-auto" onchange="S.sp.stt=this.value;S.sp.page=1;render()">${opt(['','New','In Progress','Pending','Resolved','Closed','Spam'],sp.stt)}</select>
        <button class="btn2" onclick="render()">⛃ Filter</button>
        <button class="btn2" onclick="exportTickets()">⬇ Export Tickets</button>
      </div>
      <div class="card overflow-hidden">
        ${bulk?`<div class="p-3">${bulk}</div>`:''}
        <div class="overflow-x-auto"><table class="w-full text-left min-w-[860px]">
          <thead class="bg-violet-50 text-sm text-violet-900/70"><tr><th class="p-3 w-10"><input type="checkbox" ${allOn?'checked':''} onclick="supAllToggle()"></th><th class="p-3">#</th><th class="p-3">Ticket ID</th><th class="p-3">Customer</th><th class="p-3">Subject</th><th class="p-3">Priority</th><th class="p-3">Status</th><th class="p-3">Date</th><th class="p-3">Action</th></tr></thead>
          <tbody>${body}</tbody></table></div>
        <div class="flex flex-wrap items-center justify-between gap-2 p-3 text-sm">
          <span>Showing ${L.length?(cur-1)*per+1:0} to ${Math.min(cur*per,L.length)} of ${L.length} tickets</span>
          <div class="flex gap-1"><button class="w-9 h-9 rounded-xl border border-[#ddd3f3] bg-white" onclick="supPage(${Math.max(1,cur-1)})">‹</button>${pageBtns}<button class="w-9 h-9 rounded-xl border border-[#ddd3f3] bg-white" onclick="supPage(${Math.min(pages,cur+1)})">›</button></div>
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

          <div class="grid grid-cols-2 gap-3 text-sm">
            <div><div class="text-2xl font-extrabold">${st.rated?st.sat+'%':'00%'}</div><div class="text-violet-900/70">Satisfaction Rate</div></div>
            <div><div class="text-2xl font-extrabold">${st.art?st.art.toFixed(1)+'h':'00h'}</div><div class="text-violet-900/70">Avg Response Time</div></div>

function rgFmt(inr,r){if(!(Number(r.rate)>0))return 'Set rate';const v=Number(inr)*Number(r.rate);try{return new Intl.NumberFormat(r.locale||'en-US',{style:'currency',currency:String(r.currency||'USD').toUpperCase()}).format(v)}catch(e){return String(r.currency||'')+' '+v.toFixed(2)}}
const RG_SAMPLE=999;
function regionForm(i){const r=(i!=null&&S.data.regions[i])||{};
  openModal(`<h3 class="text-xl font-extrabold mb-4">${i!=null?'Edit Region':'Add Region'}</h3><form onsubmit="saveRegion(event,${i==null?'null':i})" class="grid gap-3">
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div><label class="lbl">Country *</label><input id="rgCountry" class="inp" value="${esc(r.country||'')}" required></div><div><label class="lbl">Country code</label><input id="rgCode" class="inp uppercase" maxlength="2" value="${esc(r.code||'')}" placeholder="US"></div></div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div><label class="lbl">Language *</label><input id="rgLang" class="inp" value="${esc(r.language||'')}" required placeholder="English"></div><div><label class="lbl">Number format (locale)</label><input id="rgLocale" class="inp" value="${esc(r.locale||'')}" placeholder="en-US"></div></div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div><label class="lbl">Currency code *</label><input id="rgCur" class="inp uppercase" maxlength="3" value="${esc(r.currency||'')}" placeholder="USD" required></div><div><label class="lbl">Rate: 1 INR = ? (0 = not set)</label><input id="rgRate" type="number" min="0" step="any" class="inp" value="${r.rate!=null?esc(String(r.rate)):''}"></div></div>
  <label class="flex items-center gap-2 text-sm font-semibold"><input type="checkbox" id="rgOn" ${r.enabled!==false?'checked':''}> Show this region on the store</label>
  <div class="flex justify-end gap-2"><button type="button" class="btn2" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Save</button></div></form>`)}
async function saveRegion(e,i){e.preventDefault();
  const rec={country:$('#rgCountry').value.trim(),code:$('#rgCode').value.trim().toUpperCase(),language:$('#rgLang').value.trim(),locale:$('#rgLocale').value.trim()||'en-US',currency:$('#rgCur').value.trim().toUpperCase(),rate:Number($('#rgRate').value)||0,enabled:$('#rgOn').checked};
  if(!/^[A-Z]{3}$/.test(rec.currency))return toast('Currency code must be 3 letters, like USD');
  const list=(S.data.regions||[]).slice();if(i==null)list.push(rec);else list[i]=rec;
  try{await saveSetting('regions',list);S.data.regions=list;logActivity('Region '+rec.country+' saved');closeModal();render();toast('Region saved')}catch(err){toast('Save failed: '+(err.message||err.code))}}
async function toggleRegion(i,on){const list=(S.data.regions||[]).slice();if(!list[i])return;list[i]={...list[i],enabled:!!on};try{await saveSetting('regions',list);S.data.regions=list;render()}catch(err){toast('Update failed: '+(err.message||err.code))}}
async function delRegion(i){const list=(S.data.regions||[]).slice();const r=list[i];if(!r||!confirm('Delete '+r.country+'?'))return;list.splice(i,1);try{await saveSetting('regions',list);S.data.regions=list;logActivity('Region '+r.country+' deleted');render();toast('Region deleted')}catch(err){toast('Delete failed: '+(err.message||err.code))}}
PAGES.regions=()=>{
  const L=S.data.regions||[];const on=L.filter(r=>r.enabled!==false);
  const tl=(label,val,sub,bg,ic,fg)=>`<div class="tile" style="background:${bg}"><div class="w-14 h-14 rounded-2xl grid place-items-center text-2xl bg-white/70">${ic}</div><div class="flex-1 min-w-0"><div class="text-sm text-violet-900/70">${label}</div><div class="text-2xl font-extrabold" style="color:${fg}">${val}</div><div class="text-xs font-bold text-violet-900/50">${sub}</div></div></div>`;

    :`<tr><td colspan="7">${empty('No countries added yet. Click "Add Region" to add a country, language and currency.')}</td></tr>`;
  return head('Regions &amp; Currency','Set which countries, languages and currencies your store shows',
    `<button class="btn" onclick="regionForm()">＋ Add Region</button>`)+`

async function uploadProdImage(file,key,colour){const bmp=await createImageBitmap(file);const max=1600;const k=Math.min(1,max/Math.max(bmp.width,bmp.height));

async function markRead(id){try{await db.collection('admin_activity').doc(id).update({read:true});const x=S.data.activity.find(a=>a._id===id);if(x)x.read=true;render()}catch(err){toast('Update failed')}}
async function markAllRead(){try{const b=db.batch?db.batch():null;const todo=S.data.activity.filter(a=>!a.read);for(const x of todo){await db.collection('admin_activity').doc(x._id).update({read:true});x.read=true}render();toast('All marked read')}catch(err){toast('Update failed')}}
async function delActivity(id){if(!confirm('Delete this notification?'))return;try{await db.collection('admin_activity').doc(id).delete();S.data.activity=S.data.activity.filter(a=>a._id!==id);render()}catch(err){toast('Delete failed')}}
async function clearRead(){const todo=S.data.activity.filter(a=>a.read);if(!todo.length)return toast('No read notifications');if(!confirm('Delete '+todo.length+' read notifications?'))return;for(const x of todo){try{await db.collection('admin_activity').doc(x._id).delete()}catch(e){}}S.data.activity=S.data.activity.filter(a=>!a.read);render();toast('Cleared')}
function exportActivity(){const A=S.data.activity;if(!A.length)return toast('No activity to export');const lines=['By,Action,Date',...A.map(x=>[x.by,x.text,x.at].map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(','))];const b=new Blob([lines.join('\n')],{type:'text/csv'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='admin_activity.csv';document.body.appendChild(l);l.click();l.remove();URL.revokeObjectURL(u)}
window._stab=window._stab||'general';
const SITE_FLAGS=[['featShop','Enable Online Shopping',true],['featOffers','Enable Offers & Discounts',true],['featWish','Enable Wishlist',true],['featNotif','Enable Notifications',true],['featChat','Enable Live Chat Support',false],['featGuest','Enable Guest Checkout',true]];
const NOTIF_FLAGS=[['nEmail','Email Notifications',true],['nSms','SMS Notifications',true],['nOrder','Order Alerts',true],['nMarketing','Marketing Emails',false]];
const SOCIAL=[['socFb','Facebook','https://facebook.com/'],['socYt','YouTube','https://youtube.com/@'],['socIg','Instagram','https://instagram.com/'],['socTw','Twitter / X','https://twitter.com/'],['socLi','LinkedIn','https://linkedin.com/company/']];
const SET_TABS=[['general','General Settings'],['appearance','Appearance'],['seo','SEO Settings'],['social','Social Media'],['notify','Notification Settings'],['backup','Backup & Restore']];
function sv(k,def){const v=(S.data.site||{})[k];return v===undefined?def:v}
function sfield(k,label,def,type='text',req=false){return `<div><label class="lbl">${label}${req?' <span class="text-rose-600">*</span>':''}</label><input class="inp" data-k="${k}" type="${type}" value="${esc(sv(k,def)??'')}"></div>`}
function stoggle(k,label,def){return `<div class="flex items-center justify-between py-2 border-b border-violet-50 last:border-0"><span class="font-semibold text-sm">${label}</span><label class="switch"><input type="checkbox" data-t="${k}" ${sv(k,def)?'checked':''}><span class="slider"></span></label></div>`}
PAGES.settings=()=>{
  const t=window._stab;
  const tabs=`<div class="card p-2 flex flex-wrap gap-2">${SET_TABS.map(([k,l])=>`<button class="${t===k?'btn':'btn2'}" onclick="window._stab='${k}';render()">${l}</button>`).join('')}</div>`;
  const general=`<div class="grid grid-cols-1 xl:grid-cols-3 gap-4"><div class="card p-5 xl:col-span-2"><div class="font-extrabold mb-3">Basic Information</div><div class="grid md:grid-cols-2 gap-3">${sfield('storeName','Website Name','ZAVRA Online Store','text',true)}${sfield('tagline','Tagline','Shop Smart, Live Better','text',true)}${sfield('supportEmail','Website Email','support@zavra.com','email',true)}${sfield('whatsapp','Contact Number','','text',true)}<div class="md:col-span-2">${sfield('address','Address','','text',true)}</div></div></div>
    <div class="card p-5"><div class="font-extrabold mb-3">Website Features</div>${SITE_FLAGS.map(([k,l,d])=>stoggle(k,l,d)).join('')}</div></div>`;
  const appearance=`<div class="card p-5 grid md:grid-cols-2 gap-3">${sfield('primaryColor','Primary colour (hex)','#6200EA')}${sfield('currency','Currency code','INR')}${sfield('taxRate','GST / Tax rate (%)','','number')}${sfield('codMin','COD minimum order (₹)','','number')}</div>`;
  const seo=`<div class="card p-5 grid md:grid-cols-2 gap-3">${sfield('seoTitle','Meta Title','')}${sfield('seoKeywords','Keywords','')}<div class="md:col-span-2"><label class="lbl">Meta Description</label><textarea class="inp" data-k="seoDesc" rows="3">${esc(sv('seoDesc',''))}</textarea></div></div>`;
  const social=`<div class="card p-5 grid md:grid-cols-2 gap-3">${SOCIAL.map(([k,l,pre])=>`<div><label class="lbl">${l}</label><input class="inp" data-k="${k}" placeholder="${pre}" value="${esc(sv(k,''))}"></div>`).join('')}</div>`;
  const notify=`<div class="grid grid-cols-1 xl:grid-cols-2 gap-4"><div class="card p-5">${NOTIF_FLAGS.map(([k,l,d])=>stoggle(k,l,d)).join('')}</div><div class="card p-5">${sfield('notifEmail','Notification Email','','email')}<div class="mt-4 p-4 rounded-xl bg-amber-50 text-sm"><b>Maintenance mode</b> <label class="switch float-right"><input type="checkbox" data-t="maintenance" ${sv('maintenance',false)?'checked':''}><span class="slider"></span></label><div class="text-amber-800 mt-2">When on, the website shows a maintenance page to visitors.</div></div></div></div>`;
  const backup=`<div class="grid grid-cols-1 xl:grid-cols-2 gap-4"><div class="card p-5"><div class="font-extrabold mb-2">Backup &amp; Restore</div><p class="text-sm text-violet-900/70">Backups are not connected yet.</p><div class="flex gap-2 mt-3"><button class="btn" disabled style="opacity:.6">Create Backup</button><button class="btn2" disabled style="opacity:.6">Restore Backup</button></div></div>
    <div class="card p-5"><div class="font-extrabold mb-3">Site Statistics</div><div class="grid grid-cols-3 gap-2 text-center"><div><div class="text-2xl font-extrabold">${S.data.customers.length||''}</div><div class="text-xs text-violet-900/60">Customers</div></div><div><div class="text-2xl font-extrabold">${S.data.orders.length||''}</div><div class="text-xs text-violet-900/60">Orders</div></div><div><div class="text-2xl font-extrabold">${S.data.products.length||''}</div><div class="text-xs text-violet-900/60">Products</div></div></div></div></div>`;
  const body={general,appearance,seo,social,notify,backup}[t]||general;
  const preview=`<div class="card p-5"><div class="font-extrabold mb-3">Website Preview</div><div class="rounded-2xl overflow-hidden border border-violet-100"><div class="px-4 py-3 text-white font-extrabold" style="background:#6200EA">${esc(sv('storeName','ZAVRA Online Store'))}</div><div class="p-4 text-sm"><div class="font-bold">${esc(sv('tagline','Shop Smart, Live Better'))}</div><div class="text-violet-900/60 mt-1">${esc(sv('address','') )}</div></div></div></div>`;
  return head('Website Settings &amp; General Configuration','Manage your website settings, appearance and general configuration',`<button class="btn2" onclick="toast('Reset will be added with this step')">↺ Reset Settings</button><button class="btn" onclick="saveSettings()">💾 Save Changes</button>`)+tabs+`<div class="grid grid-cols-1 xl:grid-cols-3 gap-4"><div class="xl:col-span-2">${body}</div>${preview}</div>`;
};
async function saveSettings(){const d={};document.querySelectorAll('[data-k]').forEach(el=>{d[el.dataset.k]=el.type==='number'?(Number(el.value)||0):el.value});document.querySelectorAll('[data-t]').forEach(el=>{d[el.dataset.t]=el.checked});
  try{await db.collection('store').doc('site').set(d,{merge:true});S.data.site={...(S.data.site||{}),...d};render();toast('Settings saved')}catch(err){toast('Save failed: '+(err.message||err.code))}}
async function loadSite(){try{const s=await db.collection('store').doc('site').get();S.data.site=s.exists?s.data():{}}catch(e){S.data.site={}}}
async function blAdd(){const f=$('#banFile').files[0];if(!f)return toast('Choose an image first');
  try{const bmp=await createImageBitmap(f);let max=1920,q=.82,src='';
    for(let i=0;i<4;i++){const k=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);src=c.toDataURL('image/jpeg',q);if(src.length<850000)break;max=Math.round(max*.7);q-=.1}
    if(src.length>=850000)return toast('Image still too large, use a smaller file');
    const d={name:f.name,src,w:bmp.width,h:bmp.height,created:new Date().toISOString()};
    const r=await db.collection('banners').add(d);S.data.banners.unshift({_id:r.id,...d});logActivity('Uploaded banner: '+f.name);render();toast('Banner saved')}
  catch(err){toast('Upload failed: '+(err.message||err.code))}}
async function blDel(id){if(!confirm('Delete this banner?'))return;try{await db.collection('banners').doc(id).delete();S.data.banners=S.data.banners.filter(x=>x._id!==id);render();toast('Banner deleted')}catch(err){toast('Delete failed')}}
function globalSearch(q){S.q=q;if(S.view==='products'||S.view==='orders'||S.view==='customers')render()}

/* ============ RENDER ============ */
function render(){
  if(!$('#app')||$('#app').style.display==='none')return;
  renderSide();
  const n=S.data.activity.length;$('#bellCount').textContent=n;$('#bellCount').classList.toggle('hidden',!n);
  const fn=PAGES[S.view]||PAGES.dashboard;
  $('#main').innerHTML=fn();
}
</script>
</body>
</html>
